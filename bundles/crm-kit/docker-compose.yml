version: '3.8'

networks:
  crm_network:
    driver: bridge

volumes:
  limesurvey_db_data:
  limesurvey_data:
  limesurvey_upload:
  suitecrm_db_data:
  suitecrm_data:
  magneto_agent_home:
  magneto_agent_usr:
  magneto_agent_opt:
  magneto_agent_var:

services:
  # LimeSurvey MariaDB Database
  limesurvey-mariadb:
    image: r.clv.zone/e2eorg/limesurvey-mariadb
    container_name: crm_kit_limesurvey_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: limesurvey
      MYSQL_PASSWORD: limesurvey_password
      MYSQL_ROOT_PASSWORD: limesurvey_root_password
      # One password for the clouve-ops shell account, the same on every
      # service of the bundle. Each container gives it to its clouve-ops
      # user at start, and the magneto-agent container signs in with it
      # (sshpass). Without it a container starts no sshd. On a deployment
      # with the AI Assistant, Clouve makes the value and sets it on all
      # five pods. Local runs use this made-up one.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - limesurvey_db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LimeSurvey Application
  limesurvey:
    image: r.clv.zone/e2eorg/limesurvey
    container_name: crm_kit_limesurvey_app
    restart: unless-stopped
    depends_on:
      limesurvey-mariadb:
        condition: service_healthy
      suitecrm-mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      DB_TYPE: mysql
      DB_HOST: limesurvey-mariadb
      DB_PORT: 3306
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey
      DB_PASSWORD: limesurvey_password
      # LimeSurvey Admin Configuration
      ADMIN_USER: admin
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@123
      # URL Configuration
      PUBLIC_URL: http://localhost:8080
      
      INSTALL_DEMO_DATA: "true"

      # CRM Kit Integration - SuiteCRM Integration Plugin
      ENABLE_SUITECRM_INTEGRATION: "true"
      # SuiteCRM Connection Configuration
      SUITECRM_URL: http://suitecrm:80
      SUITECRM_ADMIN_USER: admin
      SUITECRM_ADMIN_PASSWORD: Admin@123
      # SuiteCRM Database Configuration (for OAuth2 client setup)
      SUITECRM_DB_HOST: suitecrm-mariadb
      SUITECRM_DB_PORT: 3306
      SUITECRM_DB_NAME: suitecrm
      SUITECRM_DB_USER: suitecrm
      SUITECRM_DB_PASSWORD: suitecrm_password
      # Same value as on the limesurvey-mariadb service. See its comment.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - limesurvey_data:/var/www/html
      - limesurvey_upload:/var/www/html/upload
    networks:
      - crm_network

  # SuiteCRM MariaDB Database
  suitecrm-mariadb:
    image: r.clv.zone/e2eorg/suitecrm-mariadb
    container_name: crm_kit_suitecrm_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm_password
      MYSQL_ROOT_PASSWORD: suitecrm_root_password
      # Same value as on the limesurvey-mariadb service. See its comment.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - suitecrm_db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SuiteCRM Application
  suitecrm:
    image: r.clv.zone/e2eorg/suitecrm
    container_name: crm_kit_suitecrm_app
    restart: unless-stopped
    depends_on:
      suitecrm-mariadb:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      # Database Configuration
      DATABASE_HOST: suitecrm-mariadb
      DATABASE_PORT: 3306
      DATABASE_NAME: suitecrm
      DATABASE_USER: suitecrm
      DATABASE_PASSWORD: suitecrm_password
      # SuiteCRM Configuration
      SUITECRM_URL: http://localhost:8081
      SUITECRM_ADMIN_USER: admin
      SUITECRM_ADMIN_PASSWORD: Admin@123
      SUITECRM_INSTALL_DEMO_DATA: "no"
      # Same value as on the limesurvey-mariadb service. See its comment.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - suitecrm_data:/var/www/html
    networks:
      - crm_network

  # Magneto Agent: the AI Assistant's container. It is a Claude Code
  # workspace in the browser with the limesurvey and suitecrm skills from
  # the magneto-skills marketplace. Each plugin's install.sh hook installs
  # the programs its scripts use at container start, and each app's persona
  # (CONTEXT.md.tpl) is pulled from the limesurvey and suitecrm containers
  # over clouve-ops SSH (sidecar-fetcher). A deployment gets this container
  # from the manifest's x-clouve-agent block. Here it is a service of its
  # own, so a local run has the assistant too.
  magneto-agent:
    image: r.clv.zone/clouveinc/magneto-agent
    container_name: crm_kit_magneto_agent
    restart: unless-stopped
    depends_on:
      limesurvey-mariadb:
        condition: service_healthy
      suitecrm-mariadb:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      MAGNETO_AGENT_USERNAME: admin
      MAGNETO_AGENT_PASSWORD: Admin@123
      MAGNETO_AGENT_ROOT_PASSWORD: Root@123

      # AI Assistant model access, for local runs only. A Clouve
      # deployment gets a managed key from the platform and never reads
      # these. Export one option in your shell before ./start.sh:
      #   - MAGNETO_AGENT_LLM_BASE_URL + MAGNETO_AGENT_LLM_KEY: a LiteLLM
      #     gateway URL and a key it issued, or
      #   - ANTHROPIC_API_KEY: your own Anthropic API key.
      # With neither set, the agent shows "The AI Assistant isn't
      # available yet". There is no key screen.
      MAGNETO_AGENT_LLM_BASE_URL: ${MAGNETO_AGENT_LLM_BASE_URL:-}
      MAGNETO_AGENT_LLM_KEY: ${MAGNETO_AGENT_LLM_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Both skills, from the magneto-skills Claude Code marketplace. The
      # Magneto Agent loader clones the marketplace at container start and
      # stages each plugin at /clouve/skills/<plugin>/plugin/.
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=limesurvey,suitecrm
      # MAGNETO_AGENT_SKILLS_GIT_TOKEN: ${MAGNETO_AGENT_SKILLS_GIT_TOKEN:-}
      # MAGNETO_AGENT_SKILLS_GIT_USERNAME: ${MAGNETO_AGENT_SKILLS_GIT_USERNAME:-}

      # Same value as on the other four services. The assistant signs in
      # to each with `sshpass -e ssh clouve-ops@...` using this password.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password

      # The four containers the Magneto Agent SSHs to at init, for two
      # pulls:
      #   - sidecar-fetcher: each app's persona (CONTEXT.md.tpl), kept in
      #     its image under /clouve/context/;
      #   - sidecar-env-fetcher: each container's settings, with its name
      #     as a prefix, so the skills can use LIMESURVEY_HOST,
      #     LIMESURVEY_DB_HOST, SUITECRM_HOST, SUITECRM_DB_HOST and the
      #     rest. Passwords go to the agent's secrets file, which
      #     clv-secret reads, and never into the environment.
      CLV_SIDECAR_HOSTS: limesurvey,limesurvey-mariadb,suitecrm,suitecrm-mariadb
      # The short names that go with CLV_SIDECAR_HOSTS, one for one. They
      # give the prefix (LIMESURVEY_, LIMESURVEY_MARIADB_, SUITECRM_,
      # SUITECRM_MARIADB_). On Kubernetes the hosts become tkt-<id>-* and
      # these stay as they are.
      CLV_SIDECAR_NAMESPACES: limesurvey,limesurvey-mariadb,suitecrm,suitecrm-mariadb
    volumes:
      - magneto_agent_home:/home
      - magneto_agent_usr:/usr
      - magneto_agent_opt:/opt
      - magneto_agent_var:/var
    networks:
      - crm_network
