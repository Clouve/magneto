version: '3.8'

networks:
  odoo_network:
    driver: bridge

volumes:
  odoo_data:
  odoo_addons:
  postgres_data:
  magneto_agent_home:
  magneto_agent_usr:
  magneto_agent_opt:
  magneto_agent_var:

services:
  odoo-postgres:
    image: r.clv.zone/e2eorg/odoo-postgres
    container_name: odoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
      # Shared per-pod password for the clouve-ops shell account. The same value
      # is set on all three services; the magneto-agent uses it to ssh in
      # (sshpass), odoo and odoo-postgres apply it to the clouve-ops user via
      # chpasswd at start. In prod this is generated by Clouve as a `secret`.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql as the mount point
      # This allows pg_upgrade to work properly with version-specific subdirectories
      - postgres_data:/var/lib/postgresql
    networks:
      - odoo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: r.clv.zone/e2eorg/odoo
    container_name: odoo_app
    restart: unless-stopped
    ports:
      - "${TEST_PORT:-8080}:8069"
    environment:
      # Database Configuration
      ODOO_DB_HOST: odoo-postgres
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: odoo_password

      # Odoo Master Password (Database Manager)
      # This password protects database management operations
      # IMPORTANT: Change this to a strong password in production!
      ODOO_MASTER_PASSWORD: odoo_master_password

      # Automatic Database Initialization
      # These settings control the automatic creation of the default database
      ODOO_DB_NAME: odoo
      ODOO_ADMIN_EMAIL: admin@example.com
      ODOO_ADMIN_PASSWORD: Admin@123
      ODOO_LANGUAGE: en_US
      ODOO_COUNTRY: US

      # Odoo URL Configuration
      # This URL is used for web.base.url configuration in Odoo
      ODOO_URL: http://${TEST_DOMAIN:-t1.test.clv}:${TEST_PORT:-8080}

      # Shared per-pod password for the clouve-ops shell account. The same value
      # is set on all three services; the magneto-agent uses it to ssh in
      # (sshpass), odoo and odoo-postgres apply it to the clouve-ops user via
      # chpasswd at start. In prod this is generated by Clouve as a `secret`.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    networks:
      - odoo_network

  magneto-agent:
    image: r.clv.zone/clouveinc/magneto-agent
    container_name: odoo_magneto_agent
    restart: unless-stopped
    ports:
      - "${MAGNETO_AGENT_PORT:-8081}:80"
    environment:
      MAGNETO_AGENT_USERNAME: admin
      MAGNETO_AGENT_PASSWORD: Admin@123
      MAGNETO_AGENT_ROOT_PASSWORD: Root@123
      # Activates the odoo DevOps plugin from the magneto-skills marketplace.
      # The loader clones it at start, stages skills/odoo/, and runs the
      # plugin's install.sh (postgresql-client, openssh-client, sshpass).
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=odoo
      # Same value as the odoo/odoo-postgres services — Claude Code authenticates
      # via `sshpass -e ssh clouve-ops@…` with this password.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
      # Hosts the agent SSHes to at init for the persona + env pulls.
      CLV_SIDECAR_HOSTS: odoo,odoo-postgres
      # 1:1 logical short-names for CLV_SIDECAR_HOSTS — see gibbon's
      # docker-compose.yml for the full rationale. Identical to
      # CLV_SIDECAR_HOSTS on docker-compose; diverges on Kubernetes.
      CLV_SIDECAR_NAMESPACES: odoo,odoo-postgres
    volumes:
      - magneto_agent_home:/home
      - magneto_agent_usr:/usr
      - magneto_agent_opt:/opt
      - magneto_agent_var:/var
    networks:
      - odoo_network
