version: '3.8'
services:
  odoo:
    image: odoo
    ports:
      - '8069:8069'
    environment:
      ODOO_HOST: odoo
      ODOO_DB_HOST: odoo-postgres
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: odoo-postgres-password
      ODOO_URL: http://localhost
      ODOO_DB_NAME: odoo
      ODOO_MASTER_PASSWORD: odoo-master-password
      ODOO_ADMIN_EMAIL: '{user.userEmail}'
      ODOO_ADMIN_PASSWORD: odoo-admin-password
    x-clouve-environment-types:
      ODOO_HOST: containerReference
      ODOO_DB_HOST: containerReference
      ODOO_DB_USER: static
      ODOO_DB_PASSWORD: secret
      ODOO_URL: applicationUrl
      ODOO_DB_NAME: static
      ODOO_MASTER_PASSWORD: secret
      ODOO_ADMIN_EMAIL: applicationUsername
      ODOO_ADMIN_PASSWORD: applicationPassword
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons
    x-clouve-metadata:
      containerName: odoo
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '19.0'
      appTitle: Odoo with AI Assistant
      appDescription: "Odoo is a comprehensive, open-source suite of business applications — CRM, accounting, inventory, HR and more — in one integrated, modular ERP. This edition adds a built-in AI Assistant: a browser-based Claude Code DevOps agent that operates your live Odoo instance through natural language — installing and upgrading modules, taking filestore-aware backups, diagnosing issues, and hardening the deployment — with safety gates that require explicit confirmation before any destructive or irreversible action. You own your Odoo data and your AI provider key."
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /web/health
      port: 8069
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 10
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:8069/web/health
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    x-clouve-volumes:
      - name: odoo-data
        size: 10
        description: Volume for Odoo data files
      - name: odoo-addons
        size: 10
        description: Volume for Odoo custom addons
  odoo-postgres:
    image: odoo-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo-postgres-password
    x-clouve-environment-types:
      POSTGRES_DB: static
      POSTGRES_USER: static
      POSTGRES_PASSWORD: secret
    volumes:
      - odoo-postgres-data:/var/lib/postgresql
    x-clouve-metadata:
      containerName: odoo-postgres
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 5432
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: odoo-postgres-data
        size: 10
        description: Volume for PostgreSQL database files
volumes:
  odoo-data:
    driver: local
  odoo-addons:
    driver: local
  odoo-postgres-data:
    driver: local
x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=odoo#odoo-skill
    git:
      token: ''
      username: ''
  advanced:
    client: null
    sidecarPullTimeout: 600
