services:
  claude:
    image: r.clv.zone/e2eorg/claude
    container_name: claude_server
    restart: unless-stopped
    ports:
      - "${TEST_HTTP_PORT:-8080}:80"
    environment:
      CLAUDE_USERNAME: admin
      CLAUDE_PASSWORD: Admin@123
      CLAUDE_ROOT_PASSWORD: Root@123
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Uses environment variable substitution for testing flexibility
      # Default username: admin
      # Override with: CLAUDE_USERNAME, CLAUDE_PASSWORD, CLAUDE_ROOT_PASSWORD, ANTHROPIC_API_KEY
    volumes:
      - claude_home:/home
      - claude_usr:/usr
      - claude_opt:/opt
      - claude_var:/var
    networks:
      - claude_network

networks:
  claude_network:
    driver: bridge

volumes:
  claude_usr:
  claude_home:
  claude_opt:
  claude_var:

