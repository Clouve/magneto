version: '3.8'
services:
  claude:
    image: r.clv.zone/e2eorg/claude:latest
    ports:
      - '80:80'
    environment:
      CLAUDE_USERNAME: '{user.firstName}_{user.lastName}'
      CLAUDE_PASSWORD: claude-password
      CLAUDE_ROOT_PASSWORD: claude-root-password
    x-clouve-environment-types:
      CLAUDE_USERNAME: applicationUsername
      CLAUDE_PASSWORD: applicationPassword
      CLAUDE_ROOT_PASSWORD: secret
    volumes:
      - claudedata:/home
      - claudeusr:/usr
      - claudeopt:/opt
      - claudedpkg:/var/lib/dpkg
      - claudeaptcache:/var/cache/apt
    x-clouve-metadata:
      containerName: claude
      purpose: Database
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '24.04'
      appTitle: Claude Code Server
      appDescription: A general-purpose Ubuntu 24.04 LTS Linux server environment accessible directly from your browser via a web terminal. Ideal for development, scripting, and system administration tasks in the cloud. Includes a full Bash shell, common CLI tools (curl, wget, git, vim, nano, htop, jq, and more), and a browser-based terminal powered by ttyd. User credentials are configurable at deploy time.
      appIcon: /thermo/assets/Company/clouvecom21/attachments/6aa987b60df39cbb-logo.png
      adminPath: /chat
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 15
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    x-clouve-volumes:
      - name: claudedata
        size: 10
        description: Persistent volume for home directories
      - name: claudeusr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: claudeopt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: claudedpkg
        size: 10
        description: Persistent volume for dpkg package database (/var/lib/dpkg)
      - name: claudeaptcache
        size: 10
        description: Persistent volume for apt package cache (/var/cache/apt)
volumes:
  claudedata:
    driver: local
  claudeusr:
    driver: local
  claudeopt:
    driver: local
  claudedpkg:
    driver: local
  claudeaptcache:
    driver: local
