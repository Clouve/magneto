version: '3.8'
services:
  claude:
    image: claude:latest
    ports:
      - '80:80'
    environment:
      CLAUDE_USERNAME: '{user.firstName}_{user.lastName}'
      CLAUDE_PASSWORD: claude-password
      CLAUDE_ROOT_PASSWORD: claude-root-password
    x-clouve-environment-types:
      CLAUDE_USERNAME: applicationUsername
      CLAUDE_PASSWORD: applicationPassword
      CLAUDE_ROOT_PASSWORD: secret
    volumes:
      - claudehome:/home
      - claudeusr:/usr
      - claudeopt:/opt
      - claudevar:/var
    x-clouve-metadata:
      containerName: claude
      purpose: Database
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '24.04'
      appTitle: Claude Code Server
      appDescription: A cloud-hosted Claude Code environment accessible directly from your browser — no local setup required. Powered by Anthropic's Claude AI, it lets technical and non-technical users alike build software, automate tasks, analyze data, and solve problems through natural conversation. Includes a full Ubuntu 24.04 LTS environment with Claude Code pre-installed, a browser-based terminal via ttyd, and persistent storage for your work across sessions.
      appIcon: /thermo/assets/Company/clouvecom21/attachments/6aa987b60df39cbb-logo.png
      adminPath: /chat
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 120
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 120s
    x-clouve-volumes:
      - name: claudehome
        size: 10
        description: Persistent volume for home directories
      - name: claudeusr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: claudeopt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: claudevar
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files)
volumes:
  claudehome:
    driver: local
  claudeusr:
    driver: local
  claudeopt:
    driver: local
  claudevar:
    driver: local
