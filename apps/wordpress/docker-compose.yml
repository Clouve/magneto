services:
  wordpress-mariadb:
    image: r.clv.zone/e2eorg/wordpress-mariadb
    container_name: wordpress_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
      MYSQL_ROOT_PASSWORD: root_password
      # Shared per-pod password for the clouve-ops shell account. The same
      # value is set on all three services; the magneto-agent container uses
      # it to ssh in (sshpass), wordpress and wordpress-mariadb apply it to
      # the clouve-ops user with chpasswd at start. In prod this is
      # generated by Clouve's marketplace as a `secret` and injected into
      # all three pods (see clv-docker-compose.yml).
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: r.clv.zone/e2eorg/wordpress
    container_name: wordpress_app
    restart: unless-stopped
    ports:
      - "${TEST_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      # WordPress configuration for automatic installation
      WORDPRESS_SITE_TITLE: My WordPress Site
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: Admin@123
      WORDPRESS_ADMIN_EMAIL: admin@example.com
      # Uses environment variable substitution for testing flexibility
      # Default: http://t1.test.clv:8080
      # Override with: TEST_DOMAIN and TEST_PORT environment variables
      WORDPRESS_SITE_URL: http://${TEST_DOMAIN:-t1.test.clv}:${TEST_PORT:-8080}
      # Additional WordPress configuration
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "false"
      # Same value as the wordpress-mariadb service — see its comment.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wordpress_network

  magneto-agent:
    image: r.clv.zone/clouveinc/magneto-agent
    container_name: wordpress_magneto_agent
    restart: unless-stopped
    ports:
      - "${MAGNETO_AGENT_PORT:-8081}:80"
    environment:
      MAGNETO_AGENT_USERNAME: admin
      MAGNETO_AGENT_PASSWORD: Admin@123
      MAGNETO_AGENT_ROOT_PASSWORD: Root@123

      # Pre-select Claude Code. Magneto Agent's .bash_profile honours this
      # env var: skips the interactive selector, marks the choice readonly
      # in every shell, and the Preferences API rejects client-change
      # requests with HTTP 400 (spec §5 Q6). No fork of Magneto Agent needed.
      # MAGNETO_AGENT_CLIENT: claude-code

      # Optional: inject a pre-authenticated key at launch. When unset,
      # Magneto Agent prompts for it on the first interactive session and
      # validates against api.anthropic.com/v1/models before storing.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Activates the WordPress DevOps plugin from the magneto-skills
      # Claude Code marketplace. The Magneto Agent loader (chat/skills.sh)
      # clones the marketplace at container start, stages the wordpress
      # plugin's payload at /clouve/skills/wordpress/plugin/, appends
      # ## Skill: wordpress to ~/.claude/CLAUDE.md from
      # context/wordpress/CONTEXT.md.tpl baked into THIS wordpress image
      # (pulled by Magneto Agent at init via clouve-ops SSH using
      # sidecar-fetcher), and runs the plugin's install.sh hook to
      # apt-install the runtime binaries the skill shells out to
      # (mysql-client, openssh-client, sshpass). The hook is idempotent
      # across restarts.
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=wordpress
      # MAGNETO_AGENT_SKILLS_GIT_TOKEN: ${MAGNETO_AGENT_SKILLS_GIT_TOKEN:-}
      # MAGNETO_AGENT_SKILLS_GIT_USERNAME: ${MAGNETO_AGENT_SKILLS_GIT_USERNAME:-}

      # Same value as the wordpress-mariadb service — Claude Code
      # authenticates to wordpress and wordpress-mariadb via
      # `sshpass -e ssh clouve-ops@…` using this password. See
      # wordpress-mariadb for the full rationale.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password

      # Hosts Magneto Agent SSHs to at init for two parallel pulls:
      #   - sidecar-fetcher: merges per-plugin CONTEXT.md.tpl files baked
      #     into each side container's /clouve/context/ tree.
      #   - sidecar-env-fetcher: reads each sibling's PID 1 env (via
      #     `sudo cat /proc/1/environ` over SSH, since sshd doesn't pass
      #     PID 1's env to user sessions) and re-exports under
      #     <UPPER(namespace)>_* prefix into /etc/profile.d/clv-sidecar-env.sh
      #     so skills can reference WORDPRESS_HOST, WORDPRESS_DB_HOST,
      #     WORDPRESS_DB_PASSWORD, etc. without this manifest having to
      #     hand-inject them. (The wordpress container's own vars already
      #     carry the WORDPRESS_ prefix, so the WORDPRESS_DB_* set is
      #     projected verbatim; WORDPRESS_HOST is synthesized.)
      CLV_SIDECAR_HOSTS: wordpress,wordpress-mariadb
      # 1:1 logical short-names for CLV_SIDECAR_HOSTS, used to derive the
      # <UPPER(name)>_* namespace prefix in /etc/profile.d/clv-sidecar-env.sh.
      # On docker-compose this is identical to CLV_SIDECAR_HOSTS; on
      # Kubernetes it stays at the short-names while CLV_SIDECAR_HOSTS gets
      # rewritten to tkt-<id>-* — that's how `${WORDPRESS_HOST}` in
      # CONTEXT.md.tpl resolves correctly across both deploy environments.
      CLV_SIDECAR_NAMESPACES: wordpress,wordpress-mariadb
    volumes:
      - magneto_agent_home:/home
      - magneto_agent_usr:/usr
      - magneto_agent_opt:/opt
      - magneto_agent_var:/var
    networks:
      - wordpress_network

volumes:
  db_data:
    driver: local
  wordpress_data:
    driver: local
  magneto_agent_home:
  magneto_agent_usr:
  magneto_agent_opt:
  magneto_agent_var:

networks:
  wordpress_network:
    driver: bridge
