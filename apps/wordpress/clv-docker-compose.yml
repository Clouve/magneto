version: '3.8'
# Magneto Agent-powered WordPress — marketplace manifest.
# See docker-compose.yml for the architectural overview and per-env-var
# rationale; this file is the Clouve marketplace projection of the same pod.
services:
  wordpress:
    image: wordpress
    ports:
      - '80:80'
    environment:
      WORDPRESS_DB_HOST: wordpress-mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-mariadb-password
      WORDPRESS_SITE_URL: http://localhost
      WORDPRESS_SITE_TITLE: My WordPress Site
      WORDPRESS_ADMIN_EMAIL: '{user.userEmail}'
      WORDPRESS_ADMIN_USER: '{user.firstName}_{user.lastName}'
      WORDPRESS_ADMIN_PASSWORD: wordpress-password
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 'false'
    x-clouve-environment-types:
      WORDPRESS_DB_HOST: containerReference
      WORDPRESS_DB_NAME: static
      WORDPRESS_DB_USER: static
      WORDPRESS_DB_PASSWORD: secret
      WORDPRESS_SITE_URL: applicationUrl
      WORDPRESS_SITE_TITLE: userConfigurable
      WORDPRESS_ADMIN_EMAIL: applicationUsername
      WORDPRESS_ADMIN_USER: applicationUsername
      WORDPRESS_ADMIN_PASSWORD: applicationPassword
      WORDPRESS_TABLE_PREFIX: static
      WORDPRESS_DEBUG: static
    volumes:
      - wordpressdata:/var/www/html
    x-clouve-metadata:
      containerName: wordpress
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 6.9.0
      appTitle: WordPress
      appDescription: A website or blog for small businesses, schools and nonprofits, which you edit in your browser. It runs WordPress, the open-source site builder, with the themes and plugins you choose. You tell the AI Assistant what you need in plain English, in a chat in your browser. It takes and restores backups, installs and updates plugins and themes, changes the site's address, sets a new admin password, clears caches, tightens security settings, and finds out why the site shows an error or a blank page. By default it asks before it changes anything. On a paid plan, the price of the AI Assistant includes an AI usage allowance, and you can buy more. On a free trial, or with free services, you use it with your own Claude subscription. You can turn it on or off. Your data stays yours.
      adminPath: /wp-admin
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    x-clouve-volumes:
      - name: wordpressdata
        size: 10
        description: 'Volume from Docker Compose for wordpress-wordpress (original: wordpress_data)'
  wordpress-mariadb:
    image: wordpress-mariadb
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress-mariadb-password
      MYSQL_ROOT_PASSWORD: wordpress-mariadb-root-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    x-clouve-metadata:
      containerName: wordpress-mariadb
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-database-password:
      engine: mariadb
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: dbdata
        size: 10
        description: 'Volume from Docker Compose for wordpress-mariadb (original: db_data)'
volumes:
  wordpressdata:
    driver: local
  dbdata:
    driver: local
x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=wordpress
    git:
      token: ''
      username: ''
