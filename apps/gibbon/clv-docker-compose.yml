version: '3.8'
# Magneto Agent-powered Gibbon — marketplace manifest.
#
# Three containers in one app pod:
#   gibbon       — the school-management app (image from apps/gibbon/)
#   gibbon-mysql — Gibbon's DB (image from apps/gibbon/image/mysql/)
#   magneto-agent    — the upstream magneto-agent image used directly. Both the
#                  Gibbon DevOps Skill payload (reference docs, playbooks,
#                  audited scripts) and its runtime apt deps (mysql,
#                  mysqldump, ssh, sshpass) are delivered at container
#                  start by the upstream skill loader (chat/skills.sh),
#                  which clones the magneto-skills Claude Code marketplace
#                  named in MAGNETO_AGENT_SKILLS and stages the requested
#                  plugin's payload at /clouve/skills/<plugin>/plugin/. The
#                  loader then runs the plugin's install.sh hook to
#                  install the apt packages that plugin needs. The
#                  per-skill CONTEXT.md.tpl is baked into the gibbon image at
#                  /clouve/context/gibbon/ and pulled by Magneto Agent at init
#                  via clouve-ops SSH (sidecar-fetcher.sh).
#                  Appended to the rendered CLAUDE.md as ## Skill: gibbon at
#                  session start. Locked to Claude Code via MAGNETO_AGENT_CLIENT=claude-code.
services:
  gibbon:
    image: gibbon:latest
    ports:
      - '80:80'
    environment:
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon-mysql-password
      GIBBON_URL: http://localhost
      GIBBON_TITLE: '{org.name}'
      GIBBON_SYSTEM_NAME: '{org.name}'
      GIBBON_ORGANISATION_NAME: '{org.name}'
      GIBBON_FIRSTNAME: '{user.firstName}'
      GIBBON_LASTNAME: '{user.lastName}'
      GIBBON_EMAIL: '{user.userEmail}'
      GIBBON_USERNAME: '{user.firstName}_{user.lastName}'
      GIBBON_PASSWORD: gibbon-password
      GIBBON_AUTOINSTALL: '1'
      DEMO_DATA: 'N'
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: '* * * * *'
      # Shared per-pod password for the clouve-ops shell account. Same
      # value reaches all three pods (gibbon, gibbon-mysql, magneto-agent):
      # Clouve generates a random password-like string for `secret`-typed
      # env vars and injects identical values into pods that declare the
      # same variable name. The agent ssh's in with `sshpass -e`; this
      # container's start-clouve-ops-sshd.sh applies it via chpasswd.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      GIBBON_URL: applicationUrl
      GIBBON_TITLE: userConfigurable
      GIBBON_SYSTEM_NAME: userConfigurable
      GIBBON_ORGANISATION_NAME: userConfigurable
      GIBBON_FIRSTNAME: userConfigurable
      GIBBON_LASTNAME: userConfigurable
      GIBBON_EMAIL: applicationUsername
      GIBBON_USERNAME: applicationUsername
      GIBBON_PASSWORD: applicationPassword
      GIBBON_AUTOINSTALL: static
      DEMO_DATA: static
      GIBBON_LOG_LEVEL: static
      GIBBON_CRON_INTERVAL: userConfigurable
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - gibbondata:/var/www/html
    x-clouve-metadata:
      containerName: gibbon
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 30.0.01
      appTitle: Gibbon with Claude Code
      appDescription: A cloud-hosted Gibbon school-management platform paired with a browser-based Claude Code workspace that knows how to safely operate it. School administrators launch the app, provide an Anthropic API key, and get both a live Gibbon instance and an AI agent that can perform upgrades, module installs, backups, diagnostics, and academic-year rollover through natural-language conversation — with built-in safety gates that refuse destructive operations without explicit confirmation. Gibbon remains a stock upstream install; the Claude Code workspace (Magneto Agent) is loaded with a Gibbon DevOps Skill containing reference docs, playbooks, and audited scripts scoped to this instance. The tenant owns the Anthropic API key and the Gibbon data; Clouve hosts the containers.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /index.php
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/index.php
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: gibbondata
        size: 10
        description: 'Volume from Docker Compose for gibbon (original: gibbon_data)'
  gibbon-mysql:
    image: gibbon-mysql:latest
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon-mysql-password
      MYSQL_ROOT_PASSWORD: gibbon-mysql-root-password
      # Same value as the gibbon and magneto-agent services — see the gibbon
      # service for the full rationale.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    x-clouve-metadata:
      containerName: gibbon-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: dbdata
        size: 10
        description: 'Volume from Docker Compose for gibbon-mysql (original: db_data)'
  magneto-agent:
    image: magneto-agent:latest
    ports:
      - '8080:80'
    environment:
      MAGNETO_AGENT_USERNAME: '{user.firstName}_{user.lastName}'
      MAGNETO_AGENT_PASSWORD: magneto-agent-password
      MAGNETO_AGENT_ROOT_PASSWORD: magneto-agent-root-password
      # Locks Claude Code as the AI client. Magneto Agent's .bash_profile honours
      # this env var: skips the interactive selector, marks the choice
      # readonly in every shell, and the Preferences API rejects client-change
      # requests with HTTP 400 (see spec §3.3). No fork of Magneto Agent needed.
      # MAGNETO_AGENT_CLIENT: claude-code
      # Activates the Gibbon DevOps plugin from the magneto-skills
      # Claude Code marketplace. The upstream Magneto Agent loader
      # (chat/skills.sh) clones the marketplace at container start,
      # stages the gibbon plugin's payload at /clouve/skills/gibbon/plugin/,
      # appends ## Skill: gibbon to ~/.claude/CLAUDE.md from the local
      # context/gibbon/CONTEXT.md.tpl baked into THIS gibbon image (pulled by Magneto Agent's sidecar-fetcher at init over clouve-ops SSH), and
      # then runs the plugin's install.sh hook — that's where the
      # apt-installs of mysql-client / openssh-client / sshpass live now,
      # in place of the retired gibbon-magneto-agent image layer.
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=gibbon
      # Pod-internal hostnames + DB creds, surfaced so the skill's playbooks
      # can refer to them by env var instead of hard-coding service names.
      GIBBON_HOST: gibbon
      GIBBON_DB_HOST: gibbon-mysql
      GIBBON_DB_NAME: gibbon
      GIBBON_DB_USER: gibbon
      GIBBON_DB_PASSWORD: gibbon-mysql-password
      # Same value as the gibbon and gibbon-mysql services — see the
      # gibbon service for the full rationale. The agent reads this from
      # the env at runtime to ssh into the side containers via
      # `sshpass -e ssh clouve-ops@…`.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
      # Hosts Magneto Agent's sidecar-fetcher SSHs to at init to merge per-plugin
      # CONTEXT.md.tpl files baked into each side container's /clouve/context/
      # tree. Comma-separated; resolves to the gibbon service in this app.
      CLV_SIDECAR_HOSTS: gibbon
    x-clouve-environment-types:
      MAGNETO_AGENT_USERNAME: applicationUsername
      MAGNETO_AGENT_PASSWORD: applicationPassword
      MAGNETO_AGENT_ROOT_PASSWORD: secret
      # MAGNETO_AGENT_CLIENT: static
      MAGNETO_AGENT_SKILLS: static
      GIBBON_HOST: containerReference
      GIBBON_DB_HOST: containerReference
      GIBBON_DB_NAME: static
      GIBBON_DB_USER: static
      # Same `secret` value as the Gibbon service's DB_PASSWORD — Clouve
      # resolves secret-typed env vars to the same generated value across
      # services when the variable name matches the target service pattern.
      # If your Clouve deployment resolves secrets per-service, replace this
      # with the concrete mechanism your orchestrator uses for cross-service
      # secret sharing (same pattern Moodle uses to read Gibbon's DB in the
      # education-kit bundle).
      GIBBON_DB_PASSWORD: secret
      CLOUVE_OPS_PASSWORD: secret
      CLV_SIDECAR_HOSTS: containerReference
    volumes:
      - magneto-agent-home:/home
      - magneto-agent-usr:/usr
      - magneto-agent-opt:/opt
      - magneto-agent-var:/var
    x-clouve-metadata:
      containerName: magneto-agent
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: magneto-agent-home
        size: 10
        description: Persistent volume for home directories (stored API key, Claude Code binary, shell history)
      - name: magneto-agent-usr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: magneto-agent-opt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: magneto-agent-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files, /etc overlay tarball)
volumes:
  gibbondata:
    driver: local
  dbdata:
    driver: local
  magneto-agent-home:
    driver: local
  magneto-agent-usr:
    driver: local
  magneto-agent-opt:
    driver: local
  magneto-agent-var:
    driver: local
