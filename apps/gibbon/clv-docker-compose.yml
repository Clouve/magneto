version: '3.8'
# AI Studio-powered Gibbon — marketplace manifest.
#
# Three containers in one app pod:
#   gibbon            — the school-management app (image from apps/gibbon/)
#   gibbon-mysql      — Gibbon's DB (image from apps/gibbon/image/mysql/)
#   gibbon-ai-studio  — thin layer on top of the upstream ai-studio image
#                       (apps/ai-studio/) that adds the runtime binaries
#                       the Gibbon DevOps Skill shells out to (mysql,
#                       mysqldump, ssh, sshpass). The skill payload —
#                       reference docs, playbooks, audited scripts, and
#                       the Gibbon-flavoured CONTEXT.md.tpl — is delivered
#                       at container start by the upstream skill loader
#                       (chat/skills.sh) when AI_STUDIO_SKILLS=DevOps/Gibbon
#                       is set on this service, resolved against the
#                       repo-root /skills/ tree (baked into the upstream
#                       image as the offline-fallback bundle, or
#                       sparse-cloned from AI_STUDIO_SKILLS_REPO when set).
#                       Locked to Claude Code via AI_STUDIO_CLIENT=claude-code.
services:
  gibbon:
    image: gibbon:latest
    ports:
      - '80:80'
    environment:
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon-mysql-password
      GIBBON_URL: http://localhost
      GIBBON_TITLE: '{org.name}'
      GIBBON_SYSTEM_NAME: '{org.name}'
      GIBBON_ORGANISATION_NAME: '{org.name}'
      GIBBON_FIRSTNAME: '{user.firstName}'
      GIBBON_LASTNAME: '{user.lastName}'
      GIBBON_EMAIL: '{user.userEmail}'
      GIBBON_USERNAME: '{user.firstName}_{user.lastName}'
      GIBBON_PASSWORD: gibbon-password
      GIBBON_AUTOINSTALL: '1'
      DEMO_DATA: 'N'
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: '* * * * *'
      # Shared per-pod password for the clouve-ops shell account. Same
      # value reaches gibbon, gibbon-mysql, and gibbon-ai-studio: Clouve
      # generates a random password-like string for `secret`-typed env
      # vars and injects identical values into pods that declare the same
      # variable name. The agent ssh's in with `sshpass -e`; this
      # container's start-clouve-ops-sshd.sh applies it via chpasswd.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      GIBBON_URL: applicationUrl
      GIBBON_TITLE: userConfigurable
      GIBBON_SYSTEM_NAME: userConfigurable
      GIBBON_ORGANISATION_NAME: userConfigurable
      GIBBON_FIRSTNAME: userConfigurable
      GIBBON_LASTNAME: userConfigurable
      GIBBON_EMAIL: applicationUsername
      GIBBON_USERNAME: applicationUsername
      GIBBON_PASSWORD: applicationPassword
      GIBBON_AUTOINSTALL: static
      DEMO_DATA: static
      GIBBON_LOG_LEVEL: static
      GIBBON_CRON_INTERVAL: userConfigurable
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - gibbondata:/var/www/html
    x-clouve-metadata:
      containerName: gibbon
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 30.0.01
      appTitle: Gibbon with Claude Code
      appDescription: A cloud-hosted Gibbon school-management platform paired with a browser-based Claude Code workspace that knows how to safely operate it. School administrators launch the app, provide an Anthropic API key, and get both a live Gibbon instance and an AI agent that can perform upgrades, module installs, backups, diagnostics, and academic-year rollover through natural-language conversation — with built-in safety gates that refuse destructive operations without explicit confirmation. Gibbon remains a stock upstream install; the Claude Code workspace (AI Studio) is loaded with a Gibbon DevOps Skill containing reference docs, playbooks, and audited scripts scoped to this instance. The tenant owns the Anthropic API key and the Gibbon data; Clouve hosts the containers.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /index.php
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/index.php
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: gibbondata
        size: 10
        description: 'Volume from Docker Compose for gibbon (original: gibbon_data)'
  gibbon-mysql:
    image: gibbon-mysql:latest
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon-mysql-password
      MYSQL_ROOT_PASSWORD: gibbon-mysql-root-password
      # Same value as the gibbon and gibbon-ai-studio services — see the
      # gibbon service for the full rationale.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    x-clouve-metadata:
      containerName: gibbon-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: dbdata
        size: 10
        description: 'Volume from Docker Compose for gibbon-mysql (original: db_data)'
  ai-studio:
    image: gibbon-ai-studio:latest
    ports:
      - '8080:80'
    environment:
      AI_STUDIO_USERNAME: '{user.firstName}_{user.lastName}'
      AI_STUDIO_PASSWORD: ai-studio-password
      AI_STUDIO_ROOT_PASSWORD: ai-studio-root-password
      # Locks Claude Code as the AI client. AI Studio's .bash_profile honours
      # this env var: skips the interactive selector, marks the choice
      # readonly in every shell, and the Preferences API rejects client-change
      # requests with HTTP 400 (see spec §3.3). No fork of AI Studio needed.
      # AI_STUDIO_CLIENT: claude-code
      # Activate the Gibbon DevOps Skill. The upstream ai-studio loader
      # (chat/skills.sh) resolves this at container start against the
      # repo-root /skills/ tree (baked into the upstream image as the
      # offline-fallback bundle, or sparse-cloned from
      # AI_STUDIO_SKILLS_REPO when set). The skill payload — reference
      # docs, playbooks, audited scripts, and the Gibbon-flavoured
      # CONTEXT.md.tpl — is materialised at /clouve/skills/devops-gibbon/,
      # symlinked into ~/.{claude,gemini,codex}/skills/devops-gibbon, and
      # the per-skill CONTEXT.md.tpl is appended as a "## Skill: …" section
      # to the rendered CLAUDE.md / GEMINI.md / AGENTS.md at session start.
      AI_STUDIO_SKILLS: DevOps/Gibbon
      # Pod-internal hostnames + DB creds, surfaced so the skill's playbooks
      # can refer to them by env var instead of hard-coding service names.
      GIBBON_HOST: gibbon
      GIBBON_DB_HOST: gibbon-mysql
      GIBBON_DB_NAME: gibbon
      GIBBON_DB_USER: gibbon
      GIBBON_DB_PASSWORD: gibbon-mysql-password
      # Same value as the gibbon and gibbon-mysql services — see the
      # gibbon service for the full rationale. The agent reads this from
      # the env at runtime to ssh into the side containers via
      # `sshpass -e ssh clouve-ops@…`.
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      AI_STUDIO_USERNAME: applicationUsername
      AI_STUDIO_PASSWORD: applicationPassword
      AI_STUDIO_ROOT_PASSWORD: secret
      # AI_STUDIO_CLIENT: static
      AI_STUDIO_SKILLS: static
      GIBBON_HOST: containerReference
      GIBBON_DB_HOST: containerReference
      GIBBON_DB_NAME: static
      GIBBON_DB_USER: static
      # Same `secret` value as the Gibbon service's DB_PASSWORD — Clouve
      # resolves secret-typed env vars to the same generated value across
      # services when the variable name matches the target service pattern.
      # If your Clouve deployment resolves secrets per-service, replace this
      # with the concrete mechanism your orchestrator uses for cross-service
      # secret sharing (same pattern Moodle uses to read Gibbon's DB in the
      # education-kit bundle).
      GIBBON_DB_PASSWORD: secret
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - ai-studio-home:/home
      - ai-studio-usr:/usr
      - ai-studio-opt:/opt
      - ai-studio-var:/var
    x-clouve-metadata:
      containerName: ai-studio
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: ai-studio-home
        size: 10
        description: Persistent volume for home directories (stored API key, Claude Code binary, shell history)
      - name: ai-studio-usr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: ai-studio-opt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: ai-studio-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files, /etc overlay tarball)
volumes:
  gibbondata:
    driver: local
  dbdata:
    driver: local
  ai-studio-home:
    driver: local
  ai-studio-usr:
    driver: local
  ai-studio-opt:
    driver: local
  ai-studio-var:
    driver: local
