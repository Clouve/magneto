version: '3.8'
services:
  gibbon:
    image: gibbon
    ports:
      - '80:80'
    environment:
      GIBBON_HOST: gibbon
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon-mysql-password
      GIBBON_URL: http://localhost
      GIBBON_TITLE: '{org.name}'
      GIBBON_SYSTEM_NAME: '{org.name}'
      GIBBON_ORGANISATION_NAME: '{org.name}'
      GIBBON_FIRSTNAME: '{user.firstName}'
      GIBBON_LASTNAME: '{user.lastName}'
      GIBBON_EMAIL: '{user.userEmail}'
      GIBBON_USERNAME: '{user.firstName}_{user.lastName}'
      GIBBON_PASSWORD: gibbon-password
      GIBBON_AUTOINSTALL: '1'
      DEMO_DATA: 'N'
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: '* * * * *'
    x-clouve-environment-types:
      GIBBON_HOST: containerReference
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      GIBBON_URL: applicationUrl
      GIBBON_TITLE: userConfigurable
      GIBBON_SYSTEM_NAME: userConfigurable
      GIBBON_ORGANISATION_NAME: userConfigurable
      GIBBON_FIRSTNAME: userConfigurable
      GIBBON_LASTNAME: userConfigurable
      GIBBON_EMAIL: applicationUsername
      GIBBON_USERNAME: applicationUsername
      GIBBON_PASSWORD: applicationPassword
      GIBBON_AUTOINSTALL: static
      DEMO_DATA: static
      GIBBON_LOG_LEVEL: static
      GIBBON_CRON_INTERVAL: userConfigurable
    volumes:
      - gibbondata:/var/www/html
    x-clouve-metadata:
      containerName: gibbon
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 30.0.1
      appTitle: Gibbon
      appDescription: A school management system for office staff and teachers, with student records, timetables and attendance in one place. Gibbon is open source, and Clouve hosts it and handles routine maintenance. You tell the AI Assistant what you need in plain English, in a chat in your browser. It upgrades Gibbon when you choose, installs modules, adds staff, students and parents, takes and restores backups, moves the school to the next academic year, and finds out why a page shows an error. By default it asks before it changes anything. On a paid plan, the price of the AI Assistant includes an AI usage allowance, and you can buy more. On a free trial, or with free services, you use it with your own Claude subscription. You can turn it on or off. Your data stays yours.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /index.php
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/index.php
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: gibbondata
        size: 10
        description: 'Volume from Docker Compose for gibbon (original: gibbon_data)'
  gibbon-mysql:
    image: gibbon-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon-mysql-password
      MYSQL_ROOT_PASSWORD: gibbon-mysql-root-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    x-clouve-metadata:
      containerName: gibbon-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-database-password:
      engine: mysql
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: dbdata
        size: 10
        description: 'Volume from Docker Compose for gibbon-mysql (original: db_data)'
volumes:
  gibbondata:
    driver: local
  dbdata:
    driver: local
x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=gibbon
    git:
      token: ''
      username: ''
  advanced:
    sidecarPullTimeout: 300
