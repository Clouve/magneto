version: '3.8'
services:
  gibbon:
    image: gibbon:latest
    ports:
      - '80:80'
    environment:
      GIBBON_HOST: gibbon
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon-mysql-password
      GIBBON_URL: http://localhost
      GIBBON_TITLE: '{org.name}'
      GIBBON_SYSTEM_NAME: '{org.name}'
      GIBBON_ORGANISATION_NAME: '{org.name}'
      GIBBON_FIRSTNAME: '{user.firstName}'
      GIBBON_LASTNAME: '{user.lastName}'
      GIBBON_EMAIL: '{user.userEmail}'
      GIBBON_USERNAME: '{user.firstName}_{user.lastName}'
      GIBBON_PASSWORD: gibbon-password
      GIBBON_AUTOINSTALL: '1'
      DEMO_DATA: 'N'
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: '* * * * *'
    x-clouve-environment-types:
      GIBBON_HOST: containerReference
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      GIBBON_URL: applicationUrl
      GIBBON_TITLE: userConfigurable
      GIBBON_SYSTEM_NAME: userConfigurable
      GIBBON_ORGANISATION_NAME: userConfigurable
      GIBBON_FIRSTNAME: userConfigurable
      GIBBON_LASTNAME: userConfigurable
      GIBBON_EMAIL: applicationUsername
      GIBBON_USERNAME: applicationUsername
      GIBBON_PASSWORD: applicationPassword
      GIBBON_AUTOINSTALL: static
      DEMO_DATA: static
      GIBBON_LOG_LEVEL: static
      GIBBON_CRON_INTERVAL: userConfigurable
    volumes:
      - gibbondata:/var/www/html
    x-clouve-metadata:
      containerName: gibbon
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 30.0.01
      appTitle: Gibbon with AI Assistant
      appDescription: A cloud-hosted Gibbon school-management platform paired with a browser-based AI Assistant workspace that knows how to safely operate it. School administrators launch the app, provide an AI provider API key, and get both a live Gibbon instance and an AI agent that can perform upgrades, module installs, backups, diagnostics, and academic-year rollover through natural-language conversation — with built-in safety gates that refuse destructive operations without explicit confirmation. Gibbon remains a stock upstream install; the AI Assistant workspace (Magneto Agent) is loaded with a Gibbon DevOps Skill containing reference docs, playbooks, and audited scripts scoped to this instance. The tenant owns the AI provider API key and the Gibbon data; Clouve hosts the containers.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /index.php
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/index.php
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: gibbondata
        size: 10
        description: 'Volume from Docker Compose for gibbon (original: gibbon_data)'
  gibbon-mysql:
    image: gibbon-mysql:latest
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon-mysql-password
      MYSQL_ROOT_PASSWORD: gibbon-mysql-root-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    x-clouve-metadata:
      containerName: gibbon-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: dbdata
        size: 10
        description: 'Volume from Docker Compose for gibbon-mysql (original: db_data)'
volumes:
  gibbondata:
    driver: local
  dbdata:
    driver: local
x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=gibbon
    git:
      token: ''
      username: ''
  advanced:
    client: null
