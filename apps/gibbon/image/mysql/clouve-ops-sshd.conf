# sshd_config drop-in for the clouve-ops operator account.
#
# Hardens the upstream openssh-server defaults to: key-only auth, no root
# login over SSH, only the dedicated clouve-ops user accepted. The
# operator (Claude Code, running inside gibbon-ai-studio) authenticates
# with the per-pod ed25519 key dropped into /clouve/ops-keys/.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers clouve-ops
UsePAM yes
