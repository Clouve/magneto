# Local-dev variant of the AI Studio-powered Gibbon app.
#
# Mirrors clv-docker-compose.yml but targets plain docker-compose:
#   - uses the gibbon-ai-studio image — a thin layer on top of the stock
#     ai-studio image that adds the runtime binaries the Gibbon DevOps
#     Skill shells out to (mysql, mysqldump, ssh, sshpass). The skill
#     payload itself is delivered at container start via
#     AI_STUDIO_SKILLS=DevOps/Gibbon (resolved against the repo-root
#     /skills/ tree, baked into the upstream image as the offline
#     fallback). Skill content edits flow into running containers
#     without rebuilding gibbon-ai-studio when AI_STUDIO_SKILLS_REPO is
#     set; otherwise rebuild ai-studio to refresh the bundled fallback.
#   - host-published ports (Gibbon on 8080, AI Studio on 8081 by default)
#   - the .data/ pattern used by the other apps in this repo for persistent state
#
# Usage:
#     ./start.sh apps/gibbon
# or:
#     docker compose up
#
# Set ANTHROPIC_API_KEY in your shell to skip the in-terminal key prompt.
services:
  gibbon-mysql:
    image: r.clv.zone/e2eorg/gibbon-mysql
    container_name: gibbon_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon_password
      MYSQL_ROOT_PASSWORD: root_password
      # Shared per-pod password for the clouve-ops shell account. The same
      # value is set on all three services; gibbon-ai-studio uses it to
      # ssh in (sshpass), gibbon and gibbon-mysql apply it to the
      # clouve-ops user with chpasswd at start. In prod this is generated
      # by Clouve's marketplace as a `secret` and injected into all three
      # pods (see clv-docker-compose.yml).
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gibbon_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  gibbon:
    image: r.clv.zone/e2eorg/gibbon
    container_name: gibbon_app
    restart: unless-stopped
    ports:
      - "${GIBBON_PORT:-8080}:80"
    environment:
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon_password
      GIBBON_AUTOINSTALL: "1"
      GIBBON_URL: http://${TEST_DOMAIN:-t1.test.clv}:${GIBBON_PORT:-8080}
      GIBBON_TITLE: My School
      GIBBON_FIRSTNAME: Admin
      GIBBON_LASTNAME: User
      GIBBON_EMAIL: admin@example.com
      GIBBON_USERNAME: admin
      GIBBON_PASSWORD: Admin@123
      GIBBON_SYSTEM_NAME: My School
      GIBBON_ORGANISATION_NAME: My School
      GIBBON_ORGANISATION_INITIALS: MS
      DEMO_DATA: "N"
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: "* * * * *"
      # Same value as the gibbon-mysql service — see its comment.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - gibbon_data:/var/www/html
    networks:
      - gibbon_network

  ai-studio:
    image: r.clv.zone/e2eorg/gibbon-ai-studio
    container_name: gibbon_ai_studio
    restart: unless-stopped
    ports:
      - "${AI_STUDIO_PORT:-8081}:80"
    environment:
      AI_STUDIO_USERNAME: admin
      AI_STUDIO_PASSWORD: Admin@123
      AI_STUDIO_ROOT_PASSWORD: Root@123
      # Pre-select Claude Code; AI Studio's .bash_profile skips the selector
      # and marks the choice readonly for the session (spec §5 Q6).
      # AI_STUDIO_CLIENT: claude-code
      # Activate the Gibbon DevOps Skill. The upstream ai-studio loader
      # (chat/skills.sh) resolves this at container start, copying the
      # skill payload from the baked-in /clouve/skills-bundled/ tree
      # (or sparse-cloning AI_STUDIO_SKILLS_REPO if set) into
      # /clouve/skills/devops-gibbon/, then symlinking it into each
      # client's ~/.{claude,gemini,codex}/skills/ directory and
      # appending the per-skill CONTEXT.md.tpl section to the rendered
      # CLAUDE.md / GEMINI.md / AGENTS.md.
      AI_STUDIO_SKILLS: DevOps/Gibbon
      # Optional: inject a pre-authenticated key at launch. When unset,
      # AI Studio prompts for it on the first interactive session and
      # validates against api.anthropic.com/v1/models before storing.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Pod-internal Gibbon targets surfaced to the skill's playbooks so
      # they can refer to the services by env-var rather than hard-coding.
      GIBBON_HOST: gibbon
      GIBBON_DB_HOST: gibbon-mysql
      GIBBON_DB_NAME: gibbon
      GIBBON_DB_USER: gibbon
      GIBBON_DB_PASSWORD: gibbon_password
      # Same value as the gibbon-mysql service — Claude Code authenticates
      # to gibbon and gibbon-mysql via `sshpass -e ssh clouve-ops@…` using
      # this password. See gibbon-mysql for the full rationale.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - ai_studio_home:/home
      - ai_studio_usr:/usr
      - ai_studio_opt:/opt
      - ai_studio_var:/var
    networks:
      - gibbon_network

volumes:
  db_data:
    driver: local
  gibbon_data:
    driver: local
  ai_studio_home:
    driver: local
  ai_studio_usr:
    driver: local
  ai_studio_opt:
    driver: local
  ai_studio_var:
    driver: local

networks:
  gibbon_network:
    driver: bridge
