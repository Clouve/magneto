# Local-dev variant of the AI Studio-powered Gibbon app.
#
# Mirrors clv-docker-compose.yml but targets plain docker-compose:
#   - uses the pre-bundled gibbon-ai-studio image; the Gibbon DevOps Skill,
#     the /etc/profile.d/ symlink drop-in, and the Gibbon-flavoured
#     CLAUDE.md.tpl are all baked into the image at build time. Skill or
#     persona edits require `./build.sh apps/gibbon` to take effect — dev
#     is a faithful reproduction of prod.
#   - host-published ports (Gibbon on 8080, AI Studio on 8081 by default)
#   - the .data/ pattern used by the other apps in this repo for persistent state
#
# Usage:
#     ./start.sh apps/gibbon
# or:
#     docker compose up
#
# Set ANTHROPIC_API_KEY in your shell to skip the in-terminal key prompt.
services:
  gibbon-mysql:
    image: r.clv.zone/e2eorg/gibbon-mysql
    container_name: gibbon_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gibbon
      MYSQL_USER: gibbon
      MYSQL_PASSWORD: gibbon_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      # Shared per-pod ed25519 keypair channel for the clouve-ops shell
      # account. Generated by gibbon-ai-studio's entrypoint on first boot;
      # this container's own entrypoint waits for the public key to appear
      # then installs it as clouve-ops's only authorized_key.
      - clouve_ops_keys:/clouve/ops-keys
    networks:
      - gibbon_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  gibbon:
    image: r.clv.zone/e2eorg/gibbon
    container_name: gibbon_app
    restart: unless-stopped
    ports:
      - "${GIBBON_PORT:-8080}:80"
    environment:
      DB_HOST: gibbon-mysql
      DB_NAME: gibbon
      DB_USER: gibbon
      DB_PASSWORD: gibbon_password
      GIBBON_AUTOINSTALL: "1"
      GIBBON_URL: http://${TEST_DOMAIN:-t1.test.clv}:${GIBBON_PORT:-8080}
      GIBBON_TITLE: My School
      GIBBON_FIRSTNAME: Admin
      GIBBON_LASTNAME: User
      GIBBON_EMAIL: admin@example.com
      GIBBON_USERNAME: admin
      GIBBON_PASSWORD: Admin@123
      GIBBON_SYSTEM_NAME: My School
      GIBBON_ORGANISATION_NAME: My School
      GIBBON_ORGANISATION_INITIALS: MS
      DEMO_DATA: "N"
      GIBBON_LOG_LEVEL: info
      GIBBON_CRON_INTERVAL: "* * * * *"
    volumes:
      - gibbon_data:/var/www/html
      # See the gibbon-mysql service for the rationale on this mount.
      - clouve_ops_keys:/clouve/ops-keys
    networks:
      - gibbon_network

  ai-studio:
    image: r.clv.zone/e2eorg/gibbon-ai-studio
    container_name: gibbon_ai_studio
    restart: unless-stopped
    ports:
      - "${AI_STUDIO_PORT:-8081}:80"
    environment:
      AI_STUDIO_USERNAME: admin
      AI_STUDIO_PASSWORD: Admin@123
      AI_STUDIO_ROOT_PASSWORD: Root@123
      # Pre-select Claude Code; AI Studio's .bash_profile skips the selector
      # and marks the choice readonly for the session (spec §5 Q6).
      AI_STUDIO_CLIENT: claude-code
      # Optional: inject a pre-authenticated key at launch. When unset,
      # AI Studio prompts for it on the first interactive session and
      # validates against api.anthropic.com/v1/models before storing.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Pod-internal Gibbon targets surfaced to the skill's playbooks so
      # they can refer to the services by env-var rather than hard-coding.
      GIBBON_HOST: gibbon
      GIBBON_DB_HOST: gibbon-mysql
      GIBBON_DB_NAME: gibbon
      GIBBON_DB_USER: gibbon
      GIBBON_DB_PASSWORD: gibbon_password
    volumes:
      - ai_studio_home:/home
      - ai_studio_usr:/usr
      - ai_studio_opt:/opt
      - ai_studio_var:/var
      # Per-pod ed25519 keypair channel for the clouve-ops shell account
      # in gibbon and gibbon-mysql. This container's entrypoint generates
      # the keypair into /clouve/ops-keys/ on first boot; the other two
      # containers' entrypoints poll for the public-key file and install
      # it as clouve-ops's only authorized_key.
      - clouve_ops_keys:/clouve/ops-keys
    networks:
      - gibbon_network

volumes:
  db_data:
    driver: local
  gibbon_data:
    driver: local
  ai_studio_home:
    driver: local
  ai_studio_usr:
    driver: local
  ai_studio_opt:
    driver: local
  ai_studio_var:
    driver: local
  # Per-pod tmpfs-style channel for the clouve-ops ed25519 keypair (one
  # private + one public file, no other content). Lifecycle == compose
  # project lifecycle: wiped by `./start.sh apps/gibbon --cleanup`, so a
  # redeploy gets a fresh key.
  clouve_ops_keys:
    driver: local

networks:
  gibbon_network:
    driver: bridge
