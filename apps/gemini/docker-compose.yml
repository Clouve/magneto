services:
  gemini:
    image: r.clv.zone/e2eorg/gemini
    container_name: gemini_server
    restart: unless-stopped
    ports:
      - "${TEST_HTTP_PORT:-8080}:80"
    environment:
      GEMINI_USERNAME: admin
      GEMINI_PASSWORD: Admin@123
      GEMINI_ROOT_PASSWORD: Root@123
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Uses environment variable substitution for testing flexibility
      # Default username: admin
      # Override with: GEMINI_USERNAME, GEMINI_PASSWORD, GEMINI_ROOT_PASSWORD, GEMINI_API_KEY
    volumes:
      - .data/home:/home
      - .data/usr:/usr
      - .data/opt:/opt
      - .data/var:/var
    networks:
      - gemini_network

networks:
  gemini_network:
    driver: bridge
