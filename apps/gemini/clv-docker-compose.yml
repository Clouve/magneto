version: '3.8'
services:
  gemini:
    image: gemini:latest
    ports:
      - '80:80'
    environment:
      GEMINI_USERNAME: '{user.firstName}_{user.lastName}'
      GEMINI_PASSWORD: gemini-password
      GEMINI_ROOT_PASSWORD: gemini-root-password
    x-clouve-environment-types:
      GEMINI_USERNAME: applicationUsername
      GEMINI_PASSWORD: applicationPassword
      GEMINI_ROOT_PASSWORD: secret
    volumes:
      - geminihome:/home
      - geminiusr:/usr
      - geminiopt:/opt
      - geminivar:/var
    x-clouve-metadata:
      containerName: gemini
      purpose: Database
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '24.04'
      appTitle: Gemini CLI Server
      appDescription: A cloud-hosted Gemini CLI environment accessible directly from your browser — no local setup required. Powered by Google's Gemini AI, it lets technical and non-technical users alike build software, automate tasks, analyze data, and solve problems through natural conversation. Includes a full Ubuntu 24.04 LTS environment with Gemini CLI pre-installed, a browser-based terminal via ttyd, and persistent storage for your work across sessions.
      appIcon: /thermo/assets/Company/e2eorg/attachments/d8f1a26d5efd451a-logo.png
      adminPath: /chat
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: geminihome
        size: 10
        description: Persistent volume for home directories
      - name: geminiusr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: geminiopt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: geminivar
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files)
volumes:
  geminihome:
    driver: local
  geminiusr:
    driver: local
  geminiopt:
    driver: local
  geminivar:
    driver: local
