# Installed as /etc/apache2/conf-available/clouve.conf and enabled with a2enconf.
#
# TLS ends at the ingress, and the pod serves plain HTTP on port 80. SuiteCRM has no setting of its own that
# makes it trust the ingress (TRUSTED_PROXIES does nothing in 8.10), so Apache tells PHP what the ingress saw.

# A request the ingress received over HTTPS counts as HTTPS. Without this the session cookie has no Secure flag
# and /logout redirects to http://. A caller inside the cluster, such as the LimeSurvey plugin in the Customer
# Kit, sends no such header and stays on plain HTTP.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# The client's address is the one the ingress names in X-Forwarded-For, so SuiteCRM's sign-in throttle (50
# failed attempts per address) counts people and not the ingress. Only a peer with a private address is
# trusted to name it, which is what the ingress is. From any other peer the header is ignored.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

# The access log is the container's log, which staff and log collectors read. The base image's CustomLog lines
# name the format "combined", so this definition replaces it for all of them. It is the usual combined format
# with two changes: the request is the method, the path and the protocol, without the query string, and "-"
# stands where the Referer was. Password-reset links and API tokens that travel in a query string or a Referer
# are then not logged. A value that is part of the path is still logged.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"-\" \"%{User-Agent}i\"" combined

# Apache's error lines go to the container's log as well, and by default each one ends with the request's
# Referer. This is the default format without it.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %{g}T] %7F: %E: [client\ %a] %M"

# The web root gives no folder listing. Debian's block for it turns listings on, and this one comes later.
<Directory /var/www/html/public/>
    Options -Indexes +FollowSymLinks
</Directory>

# Where people's uploads land: public/legacy/upload (documents and attachments), public/media (8.10) and
# public/media-upload (8.9). SuiteCRM reads these files itself and never asks the web server to run one. So in
# these folders and below them:
#   - PHP is off, whatever handler a file has;
#   - a file with a PHP extension is denied, in any letter case, so its source isn't served either;
#   - no .htaccess file is read, so an uploaded one can't hand another extension to PHP or lift the denial.
# Each has a <Directory> block of its own, because AllowOverride works in no other kind of block. The .htaccess
# files above these folders, which are SuiteCRM's own, still apply. Everything else in the two media folders is
# served as before.
<Directory /var/www/html/public/legacy/upload>
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/public/media>
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/public/media-upload>
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps)$">
        Require all denied
    </FilesMatch>
</Directory>
