# sshd_config drop-in for the clouve-ops operator account.
#
# It narrows openssh-server's defaults to password sign-in only, no root
# login over SSH, and the clouve-ops user alone. The operator is Claude Code,
# running in the magneto-agent container. It signs in with the per-pod
# password from CLOUVE_OPS_PASSWORD. Every service of the deployment gets the
# same value, and start-clouve-ops-sshd.sh applies it to the clouve-ops user
# with chpasswd when the container starts.

PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication no
PermitEmptyPasswords no
AllowUsers clouve-ops
UsePAM yes
