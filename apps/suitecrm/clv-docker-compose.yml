version: '3.8'
services:
  suitecrm:
    image: suitecrm
    ports:
      - '80:80'
    environment:
      DATABASE_HOST: suitecrm-mariadb
      DATABASE_PORT: '3306'
      DATABASE_NAME: suitecrm
      DATABASE_USER: suitecrm
      DATABASE_PASSWORD: suitecrm-mariadb-password
      SUITECRM_URL: http://localhost
      SUITECRM_ADMIN_USER: '{user.userEmail}'
      SUITECRM_ADMIN_PASSWORD: suitecrm-admin-password
      SUITECRM_INSTALL_DEMO_DATA: 'no'
    x-clouve-environment-types:
      DATABASE_HOST: containerReference
      DATABASE_PORT: static
      DATABASE_NAME: static
      DATABASE_USER: static
      DATABASE_PASSWORD: secret
      SUITECRM_URL: applicationUrl
      SUITECRM_ADMIN_USER: applicationUsername
      SUITECRM_ADMIN_PASSWORD: applicationPassword
      SUITECRM_INSTALL_DEMO_DATA: static
    volumes:
      - suitecrm-data:/var/www/html
    x-clouve-metadata:
      containerName: suitecrm
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 2
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 8.10.2
      appTitle: SuiteCRM
      appDescription: A hosted SuiteCRM for small sales and support teams, with accounts, contacts, leads, opportunities, cases, campaigns and reports. You tell the AI Assistant what you need in plain English, in a chat in your browser. It adds and updates accounts, contacts, leads and opportunities, checks for duplicates first, and imports a CSV after showing you what it will do. It answers questions about your pipeline, adds users, resets passwords and sets roles. It helps set up outgoing email, checks add-on modules before it installs them, takes and restores backups, and finds out why a page is broken. It shows you the command and waits for your yes before it deletes, changes many records, changes who can sign in or sends email. On a paid plan, the price of the AI Assistant includes an AI usage allowance, and you can buy more. On a free trial, or with free services, you use it with your own Claude subscription. You can turn it on or off. The tenant owns the SuiteCRM data; Clouve hosts the containers.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 30
      interval: 15
      timeout: 15
      failureThreshold: 5
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    x-clouve-volumes:
      - name: suitecrm-data
        size: 10
        description: Volume for SuiteCRM application files and data
  suitecrm-mariadb:
    image: suitecrm-mariadb
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm-mariadb-password
      MYSQL_ROOT_PASSWORD: suitecrm-mariadb-root-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - suitecrm-db-data:/var/lib/mysql
    x-clouve-metadata:
      containerName: suitecrm-mariadb
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: suitecrm-db-data
        size: 10
        description: Volume for MariaDB database files
volumes:
  suitecrm-data:
    driver: local
  suitecrm-db-data:
    driver: local
x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=suitecrm
    git:
      token: ''
      username: ''
  advanced:
    sidecarPullTimeout: 600
