version: '3.8'
# Magneto Agent-powered Moodle — marketplace manifest.
# See docker-compose.yml for the architectural overview and per-env-var
# rationale; this file is the Clouve marketplace projection of the same pod.
services:
  moodle:
    image: moodle:latest
    ports:
      - '80:80'
    environment:
      DB_HOST: moodle-mysql
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASSWORD: moodle-mysql-password
      MOODLE_URL: http://localhost:8080
      MOODLE_SITE_NAME: '{org.name}'
      MOODLE_SHORTNAME: '{org.name}'
      MOODLE_FULLNAME: '{user.firstName} {user.lastName}'
      MOODLE_EMAIL: '{user.userEmail}'
      MOODLE_USERNAME: '{user.firstName}_{user.lastName}'
      MOODLE_PASSWORD: moodle-password
      MOODLE_LOG_LEVEL: info
      ENABLE_GIBBON_INTEGRATION: 'false'
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      MOODLE_URL: applicationUrl
      MOODLE_SITE_NAME: userConfigurable
      MOODLE_SHORTNAME: userConfigurable
      MOODLE_FULLNAME: userConfigurable
      MOODLE_EMAIL: userConfigurable
      MOODLE_USERNAME: applicationUsername
      MOODLE_PASSWORD: applicationPassword
      MOODLE_LOG_LEVEL: static
      ENABLE_GIBBON_INTEGRATION: static
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - moodle-www-data:/var/www/html
      - moodle-data:/var/moodledata
    x-clouve-metadata:
      containerName: moodle
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '5.1'
      appTitle: Moodle with Claude Code
      appDescription: A cloud-hosted Moodle Learning Management System paired with a browser-based Claude Code workspace that knows how to safely operate it. School administrators and instructional designers launch the app, provide an Anthropic API key, and get both a live Moodle instance and an AI agent that can perform upgrades, plugin installs, MUC purges, backups, restores, maintenance-mode toggles, and 500-error diagnostics through natural-language conversation — with built-in safety gates that refuse destructive operations without explicit confirmation. Moodle remains a stock upstream install; the Claude Code workspace (Magneto Agent) is loaded with a Moodle DevOps Skill containing reference docs, playbooks, and audited scripts scoped to this instance. The tenant owns the Anthropic API key and the Moodle data; Clouve hosts the containers.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: moodle-www-data
        size: 10
        description: Volume for Moodle user data files
      - name: moodle-data
        size: 10
        description: Volume for Moodle user data files
  moodle-mysql:
    image: moodle-mysql:latest
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle-mysql-password
      MYSQL_ROOT_PASSWORD: moodle-mysql-root-password
      CLOUVE_OPS_PASSWORD: clouve-ops-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - moodle-db-data:/var/lib/mysql
    x-clouve-metadata:
      containerName: moodle-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: moodle-db-data
        size: 10
        description: 'Volume from Docker Compose for moodle-mysql (original: moodle_db_data)'
  magneto-agent:
    image: magneto-agent:latest
    ports:
      - '8080:80'
    environment:
      MAGNETO_AGENT_USERNAME: '{user.firstName}_{user.lastName}'
      MAGNETO_AGENT_PASSWORD: magneto-agent-password
      MAGNETO_AGENT_ROOT_PASSWORD: magneto-agent-root-password
      # MAGNETO_AGENT_CLIENT: claude-code
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=moodle
      CLOUVE_OPS_PASSWORD: clouve-ops-password
      CLV_SIDECAR_HOSTS: moodle
    x-clouve-environment-types:
      MAGNETO_AGENT_USERNAME: applicationUsername
      MAGNETO_AGENT_PASSWORD: applicationPassword
      MAGNETO_AGENT_ROOT_PASSWORD: secret
      # MAGNETO_AGENT_CLIENT: static
      MAGNETO_AGENT_SKILLS: static
      CLOUVE_OPS_PASSWORD: secret
      CLV_SIDECAR_HOSTS: containerReference
    volumes:
      - magneto-agent-home:/home
      - magneto-agent-usr:/usr
      - magneto-agent-opt:/opt
      - magneto-agent-var:/var
    x-clouve-metadata:
      containerName: magneto-agent
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: magneto-agent-home
        size: 10
        description: Persistent volume for home directories (stored API key, Claude Code binary, shell history)
      - name: magneto-agent-usr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: magneto-agent-opt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: magneto-agent-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files, /etc overlay tarball)
volumes:
  moodle-www-data:
    driver: local
  moodle-data:
    driver: local
  moodle-db-data:
    driver: local
  magneto-agent-home:
    driver: local
  magneto-agent-usr:
    driver: local
  magneto-agent-opt:
    driver: local
  magneto-agent-var:
    driver: local
