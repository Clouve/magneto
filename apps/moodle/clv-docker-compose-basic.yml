version: '3.8'
# Stock Moodle — marketplace manifest.
# See docker-compose.yml for the architectural overview and per-env-var
# rationale; this file is the Clouve marketplace projection of the same pod.
services:
  moodle:
    image: moodle:latest
    ports:
      - '80:80'
    environment:
      MOODLE_HOST: moodle
      DB_HOST: moodle-mysql
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASSWORD: moodle-mysql-password
      MOODLE_URL: http://localhost:8080
      MOODLE_SITE_NAME: '{org.name}'
      MOODLE_SHORTNAME: '{org.name}'
      MOODLE_FULLNAME: '{user.firstName} {user.lastName}'
      MOODLE_EMAIL: '{user.userEmail}'
      MOODLE_USERNAME: '{user.firstName}_{user.lastName}'
      MOODLE_PASSWORD: moodle-password
      MOODLE_LOG_LEVEL: info
      ENABLE_GIBBON_INTEGRATION: 'false'
    x-clouve-environment-types:
      MOODLE_HOST: containerReference
      DB_HOST: containerReference
      DB_NAME: static
      DB_USER: static
      DB_PASSWORD: secret
      MOODLE_URL: applicationUrl
      MOODLE_SITE_NAME: userConfigurable
      MOODLE_SHORTNAME: userConfigurable
      MOODLE_FULLNAME: userConfigurable
      MOODLE_EMAIL: userConfigurable
      MOODLE_USERNAME: applicationUsername
      MOODLE_PASSWORD: applicationPassword
      MOODLE_LOG_LEVEL: static
      ENABLE_GIBBON_INTEGRATION: static
    volumes:
      - moodle-www-data:/var/www/html
      - moodle-data:/var/moodledata
    x-clouve-metadata:
      containerName: moodle
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 1
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '5.2'
      appTitle: Moodle
      appDescription: A cloud-hosted Moodle Learning Management System delivered as a stock upstream install. School administrators and instructional designers launch the app and immediately get a live Moodle instance ready for course creation, enrollment, assessments, grading, analytics, and learner engagement. Moodle is open-source and remains a stock upstream install; Clouve hosts the containers, and the tenant owns the Moodle data.
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 30
      timeout: 15
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: moodle-www-data
        size: 10
        description: Volume for Moodle user data files
      - name: moodle-data
        size: 10
        description: Volume for Moodle user data files
  moodle-mysql:
    image: moodle-mysql:latest
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle-mysql-password
      MYSQL_ROOT_PASSWORD: moodle-mysql-root-password
    x-clouve-environment-types:
      MYSQL_DATABASE: static
      MYSQL_USER: static
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - moodle-db-data:/var/lib/mysql
    x-clouve-metadata:
      containerName: moodle-mysql
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 1
      cpuBase: 0.5
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 3306
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: moodle-db-data
        size: 10
        description: 'Volume from Docker Compose for moodle-mysql (original: moodle_db_data)'
volumes:
  moodle-www-data:
    driver: local
  moodle-data:
    driver: local
  moodle-db-data:
    driver: local
