# Magneto Agent-powered AI Studio — local-dev variant of clv-docker-compose.yml.
#
# Two containers in one pod:
#   ai-studio     — the Ubuntu 26.04 LTS workspace (image from apps/ai-studio/),
#                   pre-seeded with a running MERN starter: supervisord is PID 1
#                   and keeps sshd, mongod, the Express API (:4000), the Vite
#                   dev server (:5173) and mongo-express (:8081) up on every
#                   boot. The Magneto Agent SSHes in as `clouve-ops`
#                   (passwordless sudo) to iterate on the live app, install
#                   software, run services, and verify deploys.
#   magneto-agent — the upstream magneto-agent image used directly. Both the AI
#                   Studio skill payload (operating principles, persistence rules,
#                   SSH command shape) AND the MERN-stack knowledge layer are
#                   delivered at container start by the upstream skill loader
#                   (chat/skills.sh), which clones the magneto-skills Claude Code
#                   marketplace named in MAGNETO_AGENT_SKILLS and stages each
#                   requested plugin's payload at /clouve/skills/<plugin>/plugin/.
#                   The loader then runs each plugin's install.sh hook (ai-studio's
#                   installs openssh-client + sshpass; mern has no install.sh —
#                   it's knowledge-layer only). Skill content edits and runtime-dep
#                   changes both flow into running containers on the next restart,
#                   with no per-app image rebuild. The per-sibling CONTEXT.md.tpl
#                   is baked into the ai-studio image at /clouve/context/ai-studio/
#                   and pulled by Magneto Agent at init via clouve-ops SSH
#                   (sidecar-fetcher.sh). Appended to the rendered CLAUDE.md as
#                   ## Skill: ai-studio at session start. Locked to Claude Code
#                   via MAGNETO_AGENT_CLIENT=claude-code (optional; commented).
#
# Differs from clv-docker-compose.yml in targeting plain docker-compose: host-
# published ports (Magneto Agent on 8081, ai-studio SSH on 2222 for direct dev-time
# poking) and local named volumes for the four persistent paths on each container.
# In prod the synthesizer adds the magneto-agent container automatically based on
# the clv-docker-compose.yml's `x-clouve-agent: enabled: true` block; here we have
# to declare it explicitly because docker-compose has no Clouve synthesizer.
#
# Usage:
#     ./start.sh apps/ai-studio
# or:
#     docker compose up
#
# Set ANTHROPIC_API_KEY in your shell to skip the in-terminal key prompt.
services:
  ai-studio:
    image: r.clv.zone/e2eorg/ai-studio
    container_name: ai_studio
    restart: unless-stopped
    ports:
      # In a cluster deploy the seeded dev servers are reached through
      # clv-proxy (https://<port>-<workspace-id>.<base>/); there is no
      # clv-proxy in plain docker-compose, so publish them straight to the
      # host for direct browser testing. SSH stays published for dev-time
      # poking; the Magneto Agent reaches ai-studio over the compose network,
      # not via these host ports.
      - "${TEST_SSH_PORT:-2222}:22"
      # Vite dev server (HMR) — the seeded React app
      - "${TEST_FRONTEND_PORT:-5173}:5173"
      # Express API — the seeded backend
      - "${TEST_BACKEND_PORT:-4000}:4000"
      # mongo-express DB browser. Host port 8082 because 8081 is taken by the
      # magneto-agent chat UI below; in-container it stays on 8081.
      - "${TEST_MONGO_EXPRESS_PORT:-8082}:8081"
    environment:
      # Shared per-pod password for the clouve-ops shell account. The same
      # value is set on both services; the Magneto Agent container uses it to
      # ssh in (sshpass), ai-studio applies it to the clouve-ops user with
      # chpasswd at start (see image/installer/entrypoint.sh). In prod this
      # is generated by Clouve's marketplace as a `secret` and injected into
      # both pods (see clv-docker-compose.yml).
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password
    volumes:
      - ai_studio_home:/home
      - ai_studio_usr:/usr
      - ai_studio_opt:/opt
      - ai_studio_var:/var
    networks:
      - ai_studio_network
    # Healthy = the whole supervised stack answers: sshd accepting, the seeded
    # API serving /api/v1/health with a live Mongo connection (the grep on
    # its "mongo" readyState field is what actually proves mongod), and the
    # Vite dev server serving the app. start_period covers first-boot volume
    # seeding plus mongod + dev-server warmup.
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/22 && curl -fsS http://127.0.0.1:4000/api/v1/health | grep -q "\"mongo\":true" && curl -fsS http://127.0.0.1:5173/ >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  magneto-agent:
    image: r.clv.zone/clouveinc/magneto-agent
    container_name: ai_studio_magneto_agent
    restart: unless-stopped
    ports:
      - "${MAGNETO_AGENT_PORT:-8081}:80"
    environment:
      MAGNETO_AGENT_USERNAME: admin
      MAGNETO_AGENT_PASSWORD: Admin@123
      MAGNETO_AGENT_ROOT_PASSWORD: Root@123

      # Pre-select Claude Code. Magneto Agent's .bash_profile honours this
      # env var: skips the interactive selector, marks the choice readonly
      # in every shell, and the Preferences API rejects client-change
      # requests with HTTP 400 (spec §5 Q6). No fork of Magneto Agent needed.
      # MAGNETO_AGENT_CLIENT: claude-code

      # Optional: inject a pre-authenticated key at launch. When unset,
      # Magneto Agent prompts for it on the first interactive session and
      # validates against api.anthropic.com/v1/models before storing.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Activates the ai-studio (workspace) and mern (knowledge-layer) plugins
      # from the magneto-skills Claude Code marketplace. The Magneto Agent
      # loader (chat/skills.sh) clones the marketplace at container start,
      # stages each plugin's payload at /clouve/skills/<plugin>/plugin/,
      # appends ## Skill: <plugin> to ~/.claude/CLAUDE.md from each plugin's
      # CONTEXT.md.tpl (ai-studio's is baked into THIS ai-studio image at
      # /clouve/context/ai-studio/ — pulled by Magneto Agent at init via
      # clouve-ops SSH using sidecar-fetcher; mern is knowledge-layer with
      # no per-sibling CONTEXT.md.tpl), and runs each plugin's install.sh
      # hook (ai-studio installs openssh-client + sshpass; mern is a no-op).
      # The hooks are idempotent across restarts.
      MAGNETO_AGENT_SKILLS: https://github.com/Clouve/magneto-skills.git?plugins=ai-studio,mern
      # MAGNETO_AGENT_SKILLS_GIT_TOKEN: ${MAGNETO_AGENT_SKILLS_GIT_TOKEN:-}
      # MAGNETO_AGENT_SKILLS_GIT_USERNAME: ${MAGNETO_AGENT_SKILLS_GIT_USERNAME:-}

      # Same value as the ai-studio service — Claude Code authenticates to
      # ai-studio via `sshpass -e ssh clouve-ops@ai-studio` using this
      # password. See ai-studio for the full rationale.
      CLOUVE_OPS_PASSWORD: clouve_ops_dev_password

      # Hosts Magneto Agent SSHs to at init for two parallel pulls:
      #   - sidecar-fetcher: merges per-plugin CONTEXT.md.tpl files baked
      #     into each side container's /clouve/context/ tree.
      #   - sidecar-env-fetcher: reads each sibling's PID 1 env (via
      #     `sudo cat /proc/1/environ` over SSH, since sshd doesn't pass
      #     PID 1's env to user sessions) and re-exports under
      #     <UPPER(namespace)>_* prefix into /etc/profile.d/clv-sidecar-env.sh
      #     so skills can reference AI_STUDIO_HOST and any other env the
      #     ai-studio container exposes without this manifest having to
      #     hand-inject them.
      CLV_SIDECAR_HOSTS: ai-studio
      # 1:1 logical short-names for CLV_SIDECAR_HOSTS, used to derive the
      # <UPPER(name)>_* namespace prefix in /etc/profile.d/clv-sidecar-env.sh.
      # On docker-compose this is identical to CLV_SIDECAR_HOSTS; on
      # Kubernetes it stays at the short-names while CLV_SIDECAR_HOSTS gets
      # rewritten to tkt-<id>-* — that's how `${AI_STUDIO_HOST}` in
      # CONTEXT.md.tpl resolves correctly across both deploy environments.
      CLV_SIDECAR_NAMESPACES: ai-studio
    volumes:
      - magneto_agent_home:/home
      - magneto_agent_usr:/usr
      - magneto_agent_opt:/opt
      - magneto_agent_var:/var
    networks:
      - ai_studio_network

volumes:
  ai_studio_home:
    driver: local
  ai_studio_usr:
    driver: local
  ai_studio_opt:
    driver: local
  ai_studio_var:
    driver: local
  magneto_agent_home:
    driver: local
  magneto_agent_usr:
    driver: local
  magneto_agent_opt:
    driver: local
  magneto_agent_var:
    driver: local

networks:
  ai_studio_network:
    driver: bridge
