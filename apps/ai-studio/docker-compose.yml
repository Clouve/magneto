services:
  ai-studio:
    image: r.clv.zone/e2eorg/ai-studio
    container_name: ai_studio_server
    restart: unless-stopped
    ports:
      - "${TEST_HTTP_PORT:-8080}:80"
    environment:
      AI_STUDIO_USERNAME: admin
      AI_STUDIO_PASSWORD: Admin@123
      AI_STUDIO_ROOT_PASSWORD: Root@123
      
      # Optional — auto-detected from the HTTP Host header when omitted.
      # Useful for local dev or test.sh URL substitution.
      # AI_STUDIO_HOST: ${TEST_DOMAIN:-localhost:8080}

      # Optionally pre-set the default AI client for this instance. 
      # Supported values are: claude-code | gemini-cli | codex-cli
      # AI_STUDIO_CLIENT: claude-code # claude-code | gemini-cli | codex-cli
      
      # Optionally pre-set an API key to skip the per-session key prompt.
      # Any key provided here is injected into all login shells at startup.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ── Skill loading ───────────────────────────────────────────────
      # Comma-separated list of skills to load at container init, in
      # <Category>/<Name> form matching the on-disk paths under
      # /skills/ in the magneto repo. Each skill's CONTEXT.md.tpl is
      # rendered into ~/.claude/CLAUDE.md (and equivalents) under a
      # "## Skill: <Category> / <Name>" section, and any skill/ subtree
      # is symlinked into ~/.claude/skills/<slug>/ where <slug> is the
      # ID lowercased with "/" → "-" (e.g. DevOps/Gibbon → devops-gibbon).
      # AI_STUDIO_SKILLS: DevOps/Gibbon

      # If AI_STUDIO_SKILLS_REPO is set, the loader sparse-clones the
      # requested skills from that git URL at every container start
      # (skill iteration without rebuilding the image). When unset or
      # unreachable, the loader falls back to the skills baked into
      # the image at /clouve/skills-bundled/.
      # AI_STUDIO_SKILLS_REPO: https://github.com/clouve/magneto.git
      # AI_STUDIO_SKILLS_REF: main
      # AI_STUDIO_SKILLS_PATH: skills
      # AI_STUDIO_SKILLS_TOKEN: ${AI_STUDIO_SKILLS_TOKEN:-}  # for private repos
    volumes:
      - ai-studio-home:/home
      - ai-studio-usr:/usr
      - ai-studio-opt:/opt
      - ai-studio-var:/var
    networks:
      - ai_studio_network

volumes:
  ai-studio-home:
    driver: local
  ai-studio-usr:
    driver: local
  ai-studio-opt:
    driver: local
  ai-studio-var:
    driver: local

networks:
  ai_studio_network:
    driver: bridge
