; MongoDB 7.0 — package config minus its file log: data in /var/lib/mongodb
; (persistent volume), bound to 127.0.0.1:27017 ONLY. The systemLog block is
; stripped at image build so mongod logs to stdout and supervisord captures
; it below with rotation — nothing in this container (no cron, no systemd
; timers) could ever rotate an append-only file on the persistent volume.
; The loopback bind is the security boundary (no Mongo auth in the seed) — if
; you ever bind a non-loopback interface, enable authorization first (see the
; mern skill). Browser access goes through mongo-express; native clients
; tunnel over SSH.
[program:mongod]
command=/usr/bin/mongod --config /etc/mongod.conf
user=mongodb
priority=20
autorestart=true
startsecs=5
; give mongod time to flush and shut down cleanly on pod stop
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mongod.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
