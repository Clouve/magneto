; Seed project backend — Express API in dev/watch mode on 0.0.0.0:4000.
; Port + Mongo URL come from backend/.env (--env-file). node --watch restarts
; the process on source changes. 0.0.0.0 because clv-proxy reaches the pod
; from outside: the API is served at https://4000-<workspace-id>.<base>/.
[program:backend]
command=/usr/bin/node --env-file=.env --watch src/server.js
directory=/home/clouve-ops/projects/@SLUG@/backend
user=clouve-ops
environment=HOME="/home/clouve-ops",USER="clouve-ops"
priority=30
autorestart=true
startsecs=5
; NOTE: the supervised PID is node's --watch *watcher*; if the server child
; crashes, the watcher stays alive and this program still shows RUNNING, so
; supervisord-level restarts only cover the watcher itself dying (e.g. a bad
; .env path). mongod warmup is therefore handled inside src/server.js, which
; retries its Mongo connection in a loop rather than exiting.
startretries=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
