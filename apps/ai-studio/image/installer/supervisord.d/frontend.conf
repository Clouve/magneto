; Seed project frontend — Vite dev server with HMR on 0.0.0.0:5173 (host,
; port, allowedHosts and the /api proxy all live in frontend/vite.config.js).
; Reached at https://5173-<workspace-id>.<base>/ through clv-proxy, or
; directly on :5173 in local docker-compose dev.
[program:frontend]
command=/home/clouve-ops/projects/@SLUG@/frontend/node_modules/.bin/vite
directory=/home/clouve-ops/projects/@SLUG@/frontend
user=clouve-ops
environment=HOME="/home/clouve-ops",USER="clouve-ops"
priority=40
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
