; mongo-express — browser UI for the seeded MongoDB on 0.0.0.0:8081, reached
; at https://8081-<workspace-id>.<base>/ through clv-proxy. Basic auth stays
; OFF on purpose: clv-proxy already gates every proxied port behind the
; Magneto Agent login, and the raw DB port never leaves loopback.
;
; Installed at image build time from the mongo-express GitHub tag into /opt
; (the npm tarballs ship without their webpack assets). directory= must stay
; the install dir: app.js resolves ./build-assets.json relative to CWD.
;
; mongo-express 1.1.x refuses requests without a session secret, so the
; wrapper mints random per-boot secrets — they only sign this UI's session
; cookies, so invalidating them on restart is harmless.
[program:mongo-express]
command=/bin/bash -c "export ME_CONFIG_SITE_SESSIONSECRET=$(od -An -N32 -tx1 /dev/urandom | tr -dc a-f0-9) ME_CONFIG_SITE_COOKIESECRET=$(od -An -N32 -tx1 /dev/urandom | tr -dc a-f0-9); exec /usr/bin/node app.js"
directory=/opt/clouve/mongo-express
user=clouve-ops
environment=HOME="/home/clouve-ops",USER="clouve-ops",ME_CONFIG_MONGODB_URL="mongodb://127.0.0.1:27017",ME_CONFIG_MONGODB_ENABLE_ADMIN="true",VCAP_APP_HOST="0.0.0.0",PORT="8081"
priority=50
autorestart=true
startsecs=5
; exits if mongod isn't up yet — keep retrying through even a slow journal
; recovery (cumulative backoff across 40 retries is well over 10 minutes;
; FATAL would otherwise never be retried)
startretries=40
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mongo-express.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
