; sshd — the Magneto Agent's only path into the workspace, and the raw-TCP
; escape hatch for users (ssh -L tunnels over the per-tenant NodePort).
; Lives in image-owned /etc/supervisor/conf.d (NOT the persistent include dir)
; so no runtime edit can permanently take the agent's lifeline down.
[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sshd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
