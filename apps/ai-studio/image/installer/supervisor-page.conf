; The workspace's own page: what the deployment's address (port 80) shows. It
; points to the AI Assistant, so the address never shows a dev server to
; anyone who hasn't signed in (/clouve/page/serve.sh). Image-owned, like sshd:
; /etc resets to the image at every boot, so no edit on a volume can change it.
; Port 80 is this program's: don't bind it for anything else.
[program:page]
command=/clouve/page/serve.sh
priority=5
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/page.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
