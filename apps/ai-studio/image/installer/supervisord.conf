; AI Studio supervisord — PID 1 for the workspace container.
;
; There is no systemd here (systemctl will fail). entrypoint.sh exec's
; supervisord after applying the clouve-ops password; supervisord then starts
; and restarts every long-lived process: sshd, mongod, the seed project's
; backend + frontend dev servers, and mongo-express. If supervisord itself
; dies, the container exits and the orchestrator restarts the pod — liveness
; is tied to the whole stack's supervisor, not just sshd.
;
; Manage the stack with:  sudo supervisorctl status|start|stop|restart <name>
; Add a new long-lived service: drop a [program:<name>] conf into
; /opt/clouve/supervisord.d/ (persistent — survives pod restarts), then
; `sudo supervisorctl reread && sudo supervisorctl update`.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

; supervisorctl talks to supervisord over this root-only unix socket.
[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[include]
; /etc/supervisor/conf.d — image-owned programs (sshd). /etc resets to the
;   image state on every boot, so the agent's SSH lifeline cannot be lost to
;   a bad edit; by the same token, confs added here at runtime do NOT survive.
; /opt/clouve/supervisord.d — the seeded app stack and any services the agent
;   adds later. /opt is a persistent volume, so changes here DO survive.
files = /etc/supervisor/conf.d/*.conf /opt/clouve/supervisord.d/*.conf
