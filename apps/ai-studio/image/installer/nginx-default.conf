server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # ── Internal auth subrequest (used by auth_request only) ────────────────
    # Separate internal path so the public /_clv/api/verify remains accessible
    # to the SPA for session checks. Body is stripped — only the cookie matters.
    location = /_clv/auth/verify {                          # [clouve-platform]
        internal;
        proxy_pass http://127.0.0.1:7892/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # ── Auth API endpoints (login / logout / verify) — no auth required ──────
    location /_clv/api/ {                                    # [clouve-platform]
        rewrite ^/_clv/api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:7892;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Chat (ttyd) — protected by session auth ─────────────────────────────
    # ttyd is configured with --base-path /_clv/chat so it natively expects
    # and generates URLs under this prefix. No rewrite needed.
    location /_clv/chat {                                    # [clouve-hosted]
        auth_request /_clv/auth/verify;

        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        error_page 401 = @auth_required;
    }

    # ── FileBrowser — protected by session auth ──────────────────────────────
    # FileBrowser is configured with baseURL: /_clv/browser so it natively
    # expects and generates URLs under this prefix. No rewrite needed.
    # X-Forwarded-User is set from the auth server's X-Auth-User response
    # header so FileBrowser auto-creates / logs in the correct OS user.
    location /_clv/browser {                                 # [clouve-hosted]
        auth_request /_clv/auth/verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        client_max_body_size 0;
        proxy_pass http://127.0.0.1:7891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;

        error_page 401 = @auth_required;
    }

    # ── Static assets (CSS, JS) — served directly by nginx ──────────────────
    location /_clv/static/ {                                 # [clouve-platform]
        alias /clouve/ai-studio/installer/web/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Landing page / SPA — served by the auth server ──────────────────────
    # The Python server injects session state into the HTML server-side, so
    # the page knows whether to show the login form or the app view without
    # needing a client-side fetch or localStorage. Query-string credentials
    # (?username=X&password=Y) are also handled here via 302 redirect.
    location = /_clv/ {                                      # [clouve-platform]
        rewrite ^/_clv/$ / break;
        proxy_pass http://127.0.0.1:7892;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Root redirect to /_clv/ ────────────────────────────────────────────
    location = / {                                           # [clouve-platform]
        return 301 /_clv/;
    }

    # ── Auth-required fallback ───────────────────────────────────────────────
    # When auth_request returns 401, serve a small page that either redirects
    # to the SPA (direct navigation) or notifies the parent frame (iframe).
    location @auth_required {
        rewrite ^ /auth-required break;
        proxy_pass http://127.0.0.1:7892;
    }
}
