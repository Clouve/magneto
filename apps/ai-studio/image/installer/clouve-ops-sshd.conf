# sshd_config drop-in for the clouve-ops operator account.
#
# Hardens the upstream openssh-server defaults to: password-only auth, no
# root login over SSH, only the dedicated clouve-ops user accepted. The
# operator (Claude Code, running inside the magneto-agent container) authenticates
# with the per-pod password from CLOUVE_OPS_PASSWORD — the same value is
# set on this service and the magneto-agent container, and applied to the
# clouve-ops user via chpasswd by entrypoint.sh on container start.
# (sshd runs as a supervisord program — supervisord is PID 1 — and the
# password application happens in the entrypoint before supervisord starts,
# rather than in a background start-clouve-ops-sshd.sh helper.)

PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication no
PermitEmptyPasswords no
AllowUsers clouve-ops
UsePAM yes
