<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio — Clouve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       Login View
       ═══════════════════════════════════════════════════════ -->
  <section id="login-view">
    <div class="login-card">
      <div class="login-logo">
        <img alt="Clouve" src="https://cdn.dev.clouve.com/assets/LogoClouve2026.svg" />
        <span class="badge">AI Studio</span>
      </div>

      <h1 class="login-heading">Sign in to your workspace</h1>
      <p class="login-sub">Enter your credentials to access the terminal and file browser.</p>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>

      <div class="login-error" id="login-error" role="alert"></div>

      <footer class="login-footer">
        &copy; <span id="yr"></span> <a href="https://www.clouve.com" target="_blank" rel="noopener">Clouve</a>
      </footer>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       App View (after authentication)
       ═══════════════════════════════════════════════════════ -->
  <section id="app-view">

    <header class="app-header">
      <div class="header-left">
        <a href="https://www.clouve.com" target="_blank" rel="noopener">
          <img alt="Clouve" src="https://cdn.dev.clouve.com/assets/LogoClouve2026.svg" />
        </a>
        <span class="header-badge">AI Studio</span>
      </div>
      <div class="header-center">
        <div class="layout-switcher" id="layout-switcher" role="radiogroup" aria-label="Layout mode">
          <button class="layout-btn" id="layout-browser" data-mode="browser" role="radio" aria-checked="false" title="Files only">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="0.5" y="0.5" width="19" height="15" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor"/></svg>
            <span class="layout-label">Files</span>
          </button>
          <button class="layout-btn active" id="layout-split" data-mode="split" role="radio" aria-checked="true" title="Split view">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="0.5" y="0.5" width="19" height="15" rx="2" fill="none" stroke="currentColor"/><line x1="7" y1="1" x2="7" y2="15" stroke="currentColor"/></svg>
            <span class="layout-label">Split</span>
          </button>
          <button class="layout-btn" id="layout-chat" data-mode="chat" role="radio" aria-checked="false" title="Terminal only">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="0.5" y="0.5" width="19" height="15" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor"/></svg>
            <span class="layout-label">Terminal</span>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar" aria-hidden="true"></div>
          <span class="user-name" id="user-display"></span>
        </div>
        <div class="header-divider" aria-hidden="true"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </header>

    <main class="split-container">
      <div class="panel panel-browser" id="panel-browser">
        <div class="panel-header">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Files</span>
        </div>
        <div class="panel-content">
          <div class="frame-loading" id="loading-browser">
            <div class="spinner"></div>
          </div>
          <!-- Browser iframe injected by app.js -->
        </div>
      </div>
      <div class="divider" id="split-divider" role="separator" aria-label="Resize panels" tabindex="0">
        <div class="divider-handle"></div>
      </div>
      <div class="panel panel-chat" id="panel-chat">
        <div class="panel-header">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          <span>Terminal</span>
          <span class="status-dot" aria-label="Active"></span>
        </div>
        <div class="panel-content">
          <div class="frame-loading" id="loading-chat">
            <div class="spinner"></div>
          </div>
          <!-- Chat iframe injected by app.js -->
        </div>
      </div>
    </main>

  </section>

  <!-- Session state injected server-side by auth/server.py.
       If the user has a valid session cookie, the server replaces the
       marker with {"username":"..."} so the page renders in the correct
       state without any client-side round-trip. -->
  <script>window.__SESSION__ = /*__SESSION_DATA__*/null;</script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
