version: '3.8'

services:
  ai-studio:
    image: ai-studio:latest
    environment:
      CLOUVE_OPS_PASSWORD: ai-studio-ops-password
    x-clouve-environment-types:
      CLOUVE_OPS_PASSWORD: secret
    volumes:
      - ai-studio-home:/home
      - ai-studio-usr:/usr
      - ai-studio-opt:/opt
      - ai-studio-var:/var
    x-clouve-metadata:
      containerName: ai-studio
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 2
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '26.04'
      appTitle: AI Studio
      appDescription: A cloud-hosted blank Ubuntu 26.04 LTS server, operated by Clouve's AI assistant directly from your browser. Chat with the assistant; it installs software, writes code, runs services, and verifies deploys on the server for you — no manual SSH required. Includes the MERN-stack skill out of the box, so you can ask for a Node/Express + MongoDB + React app and have it built, configured, and running end-to-end. Adding more skills later (Python, Go, Docker, Kubernetes) is a one-line change to the deployment.
      appIcon: /thermo/assets/Company/e2eorg/attachments/b104956a61c5528f-logo.png
    x-clouve-healthcheck:
      enabled: true
      type: TCP
      path: ''
      port: 22
      initialDelay: 10
      interval: 30
      timeout: 5
      failureThreshold: 5
      successThreshold: 1
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/22 && echo -e "\n" >&3 && head -c 4 <&3 | grep -q SSH']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    x-clouve-volumes:
      - name: ai-studio-home
        size: 10
        description: Persistent volume for /home (user files, projects)
      - name: ai-studio-usr
        size: 10
        description: Persistent volume for /usr (apt-installed binaries and libraries)
      - name: ai-studio-opt
        size: 10
        description: Persistent volume for /opt (manually-installed software)
      - name: ai-studio-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, app data, systemd state)

volumes:
  ai-studio-home: { driver: local }
  ai-studio-usr:  { driver: local }
  ai-studio-opt:  { driver: local }
  ai-studio-var:  { driver: local }

x-clouve-agent:
  enabled: true
  skills:
    url: https://github.com/Clouve/magneto-skills.git?plugins=ai-studio,mern
    git:
      token: ''
      username: ''
  advanced:
    client: null
    sidecarPullTimeout: 600
