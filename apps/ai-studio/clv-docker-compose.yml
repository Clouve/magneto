version: '3.8'
services:
  ai-studio:
    image: ai-studio:latest
    ports:
      - '80:80'
    environment:
      AI_STUDIO_USERNAME: '{user.firstName}_{user.lastName}'
      AI_STUDIO_PASSWORD: ai-studio-password
      AI_STUDIO_ROOT_PASSWORD: ai-studio-root-password
    x-clouve-environment-types:
      AI_STUDIO_USERNAME: applicationUsername
      AI_STUDIO_PASSWORD: applicationPassword
      AI_STUDIO_ROOT_PASSWORD: secret
    volumes:
      - ai-studio-home:/home
      - ai-studio-usr:/usr
      - ai-studio-opt:/opt
      - ai-studio-var:/var
    x-clouve-metadata:
      containerName: ai-studio
      purpose: Database
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '24.04'
      appTitle: AI Studio
      appDescription: A cloud-hosted AI coding workspace accessible directly from your browser — no local setup required. Includes a full Ubuntu 24.04 LTS environment with an interactive AI assistant selector (choose Claude Code, Gemini CLI, or OpenAI Codex CLI at session start) and Filebrowser Quantum (web file manager at /browser/) for uploading, downloading, and editing files on your server. AI client CLIs are installed on first use and persist across sessions.
      appIcon: /thermo/assets/Company/e2eorg/attachments/b104956a61c5528f-logo.png
      adminPath: /chat
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: ai-studio-home
        size: 10
        description: Persistent volume for home directories
      - name: ai-studio-usr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: ai-studio-opt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: ai-studio-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files)
volumes:
  ai-studio-home:
    driver: local
  ai-studio-usr:
    driver: local
  ai-studio-opt:
    driver: local
  ai-studio-var:
    driver: local
