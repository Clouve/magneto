version: '3.8'
services:
  magneto-agent:
    image: magneto-agent:latest
    ports:
      - '80:80'
    environment:
      MAGNETO_AGENT_USERNAME: '{user.firstName}_{user.lastName}'
      MAGNETO_AGENT_PASSWORD: magneto-agent-password
      MAGNETO_AGENT_ROOT_PASSWORD: magneto-agent-root-password
      # Skill loading — comma-separated list of Claude Code plugin
      # marketplace URLs. Each may include ?plugins=<list> and #<branch>.
      # Empty by default; downstream apps (or marketplace presets)
      # override this to activate plugins from one or more marketplaces.
      MAGNETO_AGENT_SKILLS: ''
      # Credentials for private marketplace repos. Default + per-host
      # overrides keyed by uppercased host with dots/dashes → underscores.
      # The loader resolves credentials via GIT_ASKPASS at clone time
      # only — never persisted to disk or embedded in URLs.
      MAGNETO_AGENT_SKILLS_GIT_TOKEN: ''
      MAGNETO_AGENT_SKILLS_GIT_USERNAME: ''
    x-clouve-environment-types:
      MAGNETO_AGENT_USERNAME: applicationUsername
      MAGNETO_AGENT_PASSWORD: applicationPassword
      MAGNETO_AGENT_ROOT_PASSWORD: secret
      MAGNETO_AGENT_SKILLS: userConfigurable
      MAGNETO_AGENT_SKILLS_GIT_TOKEN: secret
      MAGNETO_AGENT_SKILLS_GIT_USERNAME: userConfigurable
    volumes:
      - magneto-agent-home:/home
      - magneto-agent-usr:/usr
      - magneto-agent-opt:/opt
      - magneto-agent-var:/var
    x-clouve-metadata:
      containerName: magneto-agent
      purpose: Database
      protocol: TCP
      isPublic: true
      memoryBase: 4
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: '24.04'
      appTitle: Magneto Agent
      appDescription: A cloud-hosted AI coding workspace accessible directly from your browser — no local setup required. Includes a full Ubuntu 24.04 LTS environment with an interactive AI assistant selector (choose Claude Code, Gemini CLI, or OpenAI Codex CLI at session start) and Filebrowser Quantum for uploading, downloading, and editing files on your server. AI client CLIs are installed on first use and persist across sessions.
      appIcon: /thermo/assets/Company/e2eorg/attachments/b104956a61c5528f-logo.png
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /
      port: 80
      initialDelay: 60
      interval: 60
      timeout: 60
      failureThreshold: 15
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:80/
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    x-clouve-volumes:
      - name: magneto-agent-home
        size: 10
        description: Persistent volume for home directories
      - name: magneto-agent-usr
        size: 10
        description: Persistent volume for system binaries and libraries (/usr)
      - name: magneto-agent-opt
        size: 10
        description: Persistent volume for optional software (/opt)
      - name: magneto-agent-var
        size: 10
        description: Persistent volume for /var (package db, cache, logs, web files)
volumes:
  magneto-agent-home:
    driver: local
  magneto-agent-usr:
    driver: local
  magneto-agent-opt:
    driver: local
  magneto-agent-var:
    driver: local
