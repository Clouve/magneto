# Installed as /etc/apache2/conf-available/clouve.conf and enabled with a2enconf.
#
# HSTS for 180 days, without includeSubDomains. TLS ends at the ingress, which sends its own header on the
# TLS hosts. This one is for Nextcloud's setup check, which falls back to http://localhost when it cannot
# reach the public URL from inside the container.
Header always set Strict-Transport-Security "max-age=15552000"
