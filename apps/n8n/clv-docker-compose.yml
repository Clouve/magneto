version: '3.8'
services:
  n8n:
    image: n8n:latest
    ports:
      - '5678:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n-postgres-password
      N8N_EDITOR_BASE_URL: http://localhost
      WEBHOOK_URL: http://localhost
      N8N_HOST: 0.0.0.0
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_RUNNERS_MODE: internal
      N8N_ENCRYPTION_KEY: n8n-encryption-key
      N8N_PROXY_HOPS: '1'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_HIRING_BANNER_ENABLED: 'false'
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    x-clouve-environment-types:
      DB_TYPE: static
      DB_POSTGRESDB_HOST: containerReference
      DB_POSTGRESDB_PORT: static
      DB_POSTGRESDB_DATABASE: static
      DB_POSTGRESDB_USER: static
      DB_POSTGRESDB_PASSWORD: secret
      N8N_EDITOR_BASE_URL: applicationUrl
      WEBHOOK_URL: applicationUrl
      N8N_HOST: static
      N8N_PORT: static
      N8N_PROTOCOL: static
      N8N_RUNNERS_MODE: static
      N8N_ENCRYPTION_KEY: secret
      N8N_PROXY_HOPS: static
      N8N_DIAGNOSTICS_ENABLED: static
      N8N_HIRING_BANNER_ENABLED: static
      GENERIC_TIMEZONE: static
      TZ: static
    volumes:
      - n8n-data:/home/node/.n8n
    x-clouve-metadata:
      containerName: n8n
      purpose: Frontend
      protocol: TCP
      isPublic: true
      memoryBase: 2
      cpuBase: 1
    x-clouve-bundle-metadata:
      appVersion: 2.12.3
      appTitle: n8n
      appDescription: n8n is a powerful workflow automation platform that connects your apps and services to automate repetitive tasks without writing code. With over 400 native integrations, n8n enables you to build complex workflows using a visual editor, trigger automations based on events, schedules, or webhooks, and transform data between systems. Its self-hosted architecture gives you full control over your data and infrastructure. Whether you need to sync data between CRMs, automate notifications, process forms, or orchestrate complex business processes, n8n provides a flexible and extensible platform that scales with your needs.
      appIcon: /thermo/assets/Company/clouveinc8/attachments/fe01a28dd743eb9d-logo.png
    x-clouve-healthcheck:
      enabled: true
      type: HTTP
      path: /healthz
      port: 5678
      initialDelay: 30
      interval: 30
      timeout: 30
      failureThreshold: 5
      successThreshold: 1
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - http://localhost:5678/healthz
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    x-clouve-volumes:
      - name: n8n-data
        size: 20
        description: Volume for n8n workflow data and credentials
  n8n-postgres:
    image: n8n-postgres:latest
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: n8n_root
      POSTGRES_PASSWORD: n8n-postgres-root-password
      POSTGRES_DB: n8n
      POSTGRES_NON_ROOT_USER: n8n
      POSTGRES_NON_ROOT_PASSWORD: n8n-postgres-password
    x-clouve-environment-types:
      POSTGRES_USER: static
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: static
      POSTGRES_NON_ROOT_USER: static
      POSTGRES_NON_ROOT_PASSWORD: secret
    volumes:
      - n8n-postgres-data:/var/lib/postgresql
    x-clouve-metadata:
      containerName: n8n-postgres
      purpose: Database
      protocol: TCP
      isPublic: false
      memoryBase: 2
      cpuBase: 2
    x-clouve-healthcheck:
      enabled: false
      type: HTTP
      path: /health
      port: 5432
      initialDelay: 30
      interval: 10
      timeout: 5
      failureThreshold: 3
      successThreshold: 1
    x-clouve-volumes:
      - name: n8n-postgres-data
        size: 20
        description: Volume for PostgreSQL database files
volumes:
  n8n-data:
    driver: local
  n8n-postgres-data:
    driver: local
