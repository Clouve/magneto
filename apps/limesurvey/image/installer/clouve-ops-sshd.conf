# sshd_config drop-in for the clouve-ops operator account.
#
# Password sign-in only, no root sign-in over SSH, and only the clouve-ops user is let in. The operator (Claude Code
# in the magneto-agent container) signs in with the deployment's password from CLOUVE_OPS_PASSWORD. The same value is
# set on each service, and start-clouve-ops-sshd.sh gives it to the clouve-ops user with chpasswd at every start.

PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication no
PermitEmptyPasswords no
AllowUsers clouve-ops
UsePAM yes
# No forwarding of any kind: the AI Assistant runs plain commands, and the pod is no relay to anything else.
DisableForwarding yes
# Each sign-in, and each failed one, is logged. start-clouve-ops-sshd.sh runs sshd with -e, so the lines go to the
# container's log: the container has no syslog daemon.
LogLevel INFO
