# Apache drop-in of the Clouve LimeSurvey image.
#
# Three folders under the web root are never served:
#   clouve/        the upgrade's backups (the old code and a database dump) and the image's state files
#   node_modules/  development files that the LimeSurvey release zip ships
#   installer/     LimeSurvey's web installer. The image installs from the command line.
# Each has a <Directory> block of its own, because AllowOverride works in no other kind of block. With
# AllowOverride None Apache reads no .htaccess file in the folder or below it, so a file written there can't open
# the folder again. The blocks go by the path on the disk, so another spelling of the address ends at the same rule.
# Apache still reads the .htaccess in the web root, which is LimeSurvey's own, and a rule in that file that grants
# access reaches into these folders too. Only www-data can write it.
<Directory /var/www/html/clouve>
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html/node_modules>
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html/installer>
    AllowOverride None
    Require all denied
</Directory>

# upload/ holds what people upload: themes, plugins, label sets and survey files. LimeSurvey loads an uploaded
# plugin's code itself, with include, and nothing fetches a PHP file from there. So in upload/ and below it:
#   - PHP is off, whatever handler a file has. No .htaccess can switch it on again, the web root's included;
#   - a file with a PHP extension is denied, in any letter case, so its source isn't served either;
#   - no .htaccess file is read, so an uploaded one can't hand another extension to PHP or lift the denial.
# Everything else in upload/ is served as before, such as a theme's style sheets, scripts and images.
<Directory /var/www/html/upload>
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

# LimeSurvey's own upload/surveys/.htaccess keeps the files that participants upload with their answers (fu_...)
# from being fetched. Apache doesn't read that file any more, so its rule is here.
<Directory /var/www/html/upload/surveys>
    <FilesMatch "^fu_[a-z0-9_]*$">
        Require all denied
    </FilesMatch>
</Directory>

# The access log is the container's log, which staff and log collectors read. The base image's two CustomLog lines
# both name the format "combined", so this definition replaces it for both. It is the usual combined format with
# two changes: the request is the method, the path and the protocol, without the query string, and "-" stands
# where the Referer was. Participant tokens, prefilled answers and reset keys in a query string or a Referer are
# then not logged. A value that is part of the path is still logged. The base image's rule that leaves out a
# probe's requests (a User-Agent with check, health or probe in it) is unchanged.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"-\" \"%{User-Agent}i\"" combined

# TLS ends at the ingress, and the pod serves plain HTTP. A request the ingress received over HTTPS counts as HTTPS,
# so LimeSurvey marks its session and CSRF cookies Secure (it goes by HTTPS in PHP's environment). A caller inside the
# cluster, such as a probe or the Customer Kit's SuiteCRM, sends no such header and stays on plain HTTP.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Apache's error lines go to the container's log as well, and by default each one ends with the request's Referer.
# This is the default format without it.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %{g}T] %7F: %E: [client\ %a] %M"
